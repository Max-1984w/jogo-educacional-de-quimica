<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"><\/script>
<script>
// ====== CONFIGURAÇÃO: cole os dados do seu projeto Supabase (Settings > API) ======
const CFG={URL:'COLE_AQUI_A_URL_DO_SUPABASE',KEY:'COLE_AQUI_A_ANON_KEY'};
// ==================================================================================
const $=id=>document.getElementById(id);
async function rpc(fn,args){
  if(CFG.URL.startsWith('COLE'))throw new Error('Configure CFG.URL e CFG.KEY no início do script.');
  const r=await fetch(CFG.URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.KEY,Authorization:'Bearer '+CFG.KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&j.message)||'Erro de comunicação');
  return j;
}
const S={att:null,qs:[],lives:3,total:0,done:0};
window.T={l:0,r:0,j:0,jp:0,e:0};

// ====== ÁUDIO (Web Audio sintetizado) ======
let AC,drone,o1,o2,vol={m:.5,s:.7};
function au(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();o1=AC.createOscillator();o2=AC.createOscillator();
 const f=AC.createBiquadFilter();f.frequency.value=240;drone=AC.createGain();o1.type='sawtooth';o2.type='sine';o1.frequency.value=55;o2.frequency.value=82;
 o1.connect(f);o2.connect(f);f.connect(drone);drone.connect(AC.destination);o1.start();o2.start();setM();
 setInterval(()=>{if(Math.random()<.5)sfx(180+Math.random()*60,1.2,'sine',-120,.4)},7000)}
function setM(){if(drone)drone.gain.value=.14*vol.m}
function tone(w){if(o1){const b=[55,49,41,46,38][w];o1.frequency.value=b;o2.frequency.value=b*1.5}}
function sfx(fr,d=.12,t='square',sl=0,v=1){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
 o.type=t;o.frequency.setValueAtTime(fr,n);o.frequency.exponentialRampToValueAtTime(Math.max(30,fr+sl),n+d);
 g.gain.setValueAtTime(.15*vol.s*v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}
$('vm').oninput=e=>{vol.m=+e.target.value;setM()};$('vs').oninput=e=>vol.s=+e.target.value;

// ====== MUNDOS ======
const W=[
{n:'A Floresta dos Esquecidos',bg:0x210B38,fog:0x4a1a6e,acc:0xB7FF00,en:['ghost','pump'],note:'"Se você está lendo isto, a carta chegou até você. O laboratório registra tudo. — M."'},
{n:'O Cemitério das Almas',bg:0x1a0a1c,fog:0x5a1030,acc:0xD71936,en:['ghost','bat'],note:'Um bilhete úmido: "Cada erro alimenta o caldeirão. Cada acerto o enfraquece."'},
{n:'O Pântano Tóxico',bg:0x0d1a12,fog:0x2a5a10,acc:0xB7FF00,en:['slime','bat'],note:'Diário de Mortimer: "A substância não escapou. Eu a deixei sair."'},
{n:'O Laboratório Proibido',bg:0x120b24,fog:0x3a1a6e,acc:0xB7FF00,en:['slime','ghost','pump'],note:'Etiqueta num frasco: "Hollow Creek — amostra 1. Ainda respira."'},
{n:'O Castelo de Mortimer',bg:0x14050c,fog:0x6a1020,acc:0xD71936,en:['ghost','pump','bat','slime'],note:'Vitral vermelho, uma inscrição: "O último caldeirão precisa de um último aluno."'}];

// ====== TEXTURAS (pixel art procedural) ======
const PF={idle:[{b:0},{b:1}],walk:[{l:3},{l:0},{l:-3},{l:0}],jump:[{l:2,a:1}],fall:[{l:-2,a:1}],land:[{sq:1}],hurt:[{h:1,a:1}],act:[{a:2}],cele:[{a:1},{a:1,b:-1}],die:[{h:1,a:1,sq:2}]};
function tx(s,k,w,h,fn){if(s.textures.exists(k))return;const g=s.make.graphics({x:0,y:0,add:false});fn(g);g.generateTexture(k,w,h);g.destroy()}
function drawP(g,o){const b=o.b||0,l=o.l||0,q=o.sq?o.sq*2:0;
 g.fillStyle(0x19151F);g.fillRect(7,26+q,4,6-q-Math.max(0,l));g.fillRect(13,26+q,4,6-q-Math.max(0,-l));
 g.fillStyle(0xD71936);g.fillRect(6,13+b+q,12,13-b-q);
 if(o.a==1){g.fillRect(3,7+b,3,7);g.fillRect(18,7+b,3,7)}else if(o.a==2){g.fillRect(18,12,6,3);g.fillRect(3,15,3,7)}else{g.fillRect(3,14+b+q,3,7);g.fillRect(18,14+b+q,3,7)}
 g.fillStyle(0xE8E2DC);g.fillRect(7,5+b+q,10,8);
 g.fillStyle(o.h?0xD71936:0xB7FF00);g.fillRect(9,8+b+q,2,2);g.fillRect(14,8+b+q,2,2);
 g.fillStyle(0x210B38);g.fillRect(5,4+b+q,14,2);g.fillRect(8,0+b+q,8,4);g.fillStyle(0xB7FF00);g.fillRect(8,3+b+q,8,1)}
function mkTex(s,wi){
 for(const n in PF)PF[n].forEach((o,i)=>tx(s,'p_'+n+'_'+i,24,32,g=>drawP(g,o)));
 [0,1].forEach(i=>{
  tx(s,'e_ghost_'+i,20,20,g=>{g.fillStyle(0xE8E2DC);g.fillRect(2,2,16,14);g.fillRect(4,0,12,2);for(let x=0;x<4;x++)g.fillRect(2+x*4,16,4,i?(x%2?4:2):(x%2?2:4));g.fillStyle(0x09070D);g.fillRect(5,6,3,4);g.fillRect(12,6,3,4)});
  tx(s,'e_pump_'+i,20,20,g=>{g.fillStyle(0xe8791a);g.fillRect(1,5,18,14);g.fillRect(3,3,14,2);g.fillStyle(0x1a5a10);g.fillRect(9,0,3,4);g.fillStyle(0xB7FF00);g.fillRect(4,9,4,4);g.fillRect(12,9,4,4);g.fillRect(6,15+i,8,2)});
  tx(s,'e_bat_'+i,22,12,g=>{g.fillStyle(0x19151F);g.fillRect(8,3,6,7);g.fillStyle(0x4a1a6e);if(i){g.fillRect(0,0,8,4);g.fillRect(14,0,8,4)}else{g.fillRect(0,5,8,4);g.fillRect(14,5,8,4)}g.fillStyle(0xD71936);g.fillRect(9,5,1,1);g.fillRect(12,5,1,1)});
  tx(s,'e_slime_'+i,20,16,g=>{g.fillStyle(0xB7FF00);g.fillRect(1,6+i,18,10-i);g.fillRect(4,3+i,12,3);g.fillStyle(0x09070D);g.fillRect(5,8+i,3,3);g.fillRect(12,8+i,3,3);g.fillStyle(0x210B38);g.fillRect(8,13,4,2)})});
 tx(s,'tile'+wi,16,16,g=>{g.fillStyle(0x19151F);g.fillRect(0,0,16,16);g.fillStyle(0x2a2233);g.fillRect(0,6,16,1);g.fillRect(8,11,8,1);g.fillStyle(W[wi].acc);g.fillRect(0,0,16,3)});
 tx(s,'mv',96,14,g=>{g.fillStyle(0x3a2a50);g.fillRect(0,0,96,14);g.fillStyle(0xD71936);g.fillRect(0,0,96,3);g.fillRect(0,0,4,14);g.fillRect(92,0,4,14)});
 tx(s,'dis',96,14,g=>{g.fillStyle(0x2a2233);g.fillRect(0,0,96,14);g.fillStyle(0xB7FF00);g.fillRect(0,0,96,2);g.fillStyle(0x09070D);for(let x=10;x<96;x+=22)g.fillRect(x,3,2,9)});
 tx(s,'spk',16,12,g=>{g.fillStyle(0xD71936);g.fillTriangle(0,12,8,0,16,12)});
 tx(s,'lamp',16,34,g=>{g.fillStyle(0x19151F);g.fillRect(7,8,2,26);g.fillRect(3,6,10,3);g.fillStyle(0x6a6a6a);g.fillRect(4,0,8,7)});
 tx(s,'caul',44,40,g=>{g.fillStyle(0x09070D);g.fillRect(4,10,36,28);g.fillRect(0,8,44,4);g.fillStyle(0xB7FF00);g.fillRect(6,10,32,4);g.fillStyle(0x19151F);g.fillRect(8,38,6,2);g.fillRect(30,38,6,2)});
 tx(s,'note',14,16,g=>{g.fillStyle(0xE8E2DC);g.fillRect(0,0,14,16);g.fillStyle(0x210B38);for(let y=3;y<14;y+=3)g.fillRect(2,y,10,1)});
}
function mkAnims(s){
 for(const n in PF){if(s.anims.exists('p_'+n))continue;
  s.anims.create({key:'p_'+n,frames:PF[n].map((o,i)=>({key:'p_'+n+'_'+i})),frameRate:n=='walk'?8:n=='idle'?2:n=='cele'?4:1,repeat:-1})}
 if(!s.anims.exists('p_run'))s.anims.create({key:'p_run',frames:PF.walk.map((o,i)=>({key:'p_walk_'+i})),frameRate:15,repeat:-1});
 ['ghost','pump','bat','slime'].forEach(k=>{if(!s.anims.exists('e_'+k))s.anims.create({key:'e_'+k,frames:[{key:'e_'+k+'_0'},{key:'e_'+k+'_1'}],frameRate:k=='bat'?9:3,repeat:-1})})}

// ====== UI ======
function msgBox(t,x,cb,btn='Continuar'){$('mt').textContent=t;$('mx').textContent=x;$('mb').textContent=btn;$('msg').classList.add('on');
 $('mb').onclick=()=>{$('msg').classList.remove('on');cb&&cb()}}
function hud(sc){const w=W[sc.wi];$('hl').textContent=`Mundo ${sc.wi+1}: ${w.n}  ·  ♥ ${S.lives}  ·  Questões ${S.done}/${S.total}`}
function runQuiz(list,done){
 let i=0,chosen=null;
 const show=()=>{
  if(i>=list.length){$('quiz').classList.remove('on');return done()}
  const q=list[i];chosen=null;$('qb').className='box';$('qm').textContent='';$('qc').disabled=true;
  $('qh').textContent=`Questão ${S.done+1} de ${S.total}`;$('qf').style.width=(S.done/S.total*100)+'%';
  $('qs').textContent=q.statement;$('qo').innerHTML='';
  q.options.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o.label+') '+o.text;
   b.onclick=()=>{chosen=o.label;[...$('qo').children].forEach(c=>c.classList.remove('sel'));b.classList.add('sel');$('qc').disabled=false};$('qo').appendChild(b)});
  $('quiz').classList.add('on');
  $('qc').onclick=async()=>{
   if(!chosen)return;$('qc').disabled=true;[...$('qo').children].forEach(c=>c.disabled=true);
   try{const r=await rpc('submit_answer',{p_attempt:S.att,p_question:q.id,p_choice:chosen});
    S.done++;$('qf').style.width=(S.done/S.total*100)+'%';
    $('qb').className='box '+(r.correct?'ok':'bad');
    $('qm').textContent=r.correct?'✔ Resposta confirmada.':'✖ Resposta registrada. O laboratório anotou.';
    r.correct?sfx(660,.25,'triangle',400):sfx(150,.4,'sawtooth',-80);
    setTimeout(()=>{i++;show()},1500)
   }catch(e){$('qm').textContent=e.message;[...$('qo').children].forEach(c=>c.disabled=false);$('qc').disabled=false}}}
 show()}

// ====== FASE ======
class L extends Phaser.Scene{
 constructor(){super('L')}
 init(d){this.wi=d.w}
 create(){
  const wi=this.wi,cf=W[wi],H=540,LW=3400;this.LW=LW;this.lock=false;this.inv=0;this.stunTo=0;this.landT=0;this.coy=0;this.jc=0;this.wasAir=false;this.acting=0;this.finished=false;
  mkTex(this,wi);mkAnims(this);tone(wi);
  this.cameras.main.setBackgroundColor(cf.bg);
  let s=wi*7919+13;const R=()=>(s=(s*16807)%2147483647)/2147483647;
  // fundo com profundidade
  this.add.circle(780,90,46,0xD71936).setScrollFactor(.04).setAlpha(.9);
  for(const [sf,col,hh] of [[.25,0x150a22,200],[.5,0x0e0716,140]]){
   const g=this.add.graphics().setScrollFactor(sf);g.fillStyle(col);
   for(let x=0;x<LW*sf+1000;x+=40+R()*60)g.fillRect(x,H-hh*(.4+R()*.6),14+R()*26,hh)}
  const fg=this.add.graphics().setScrollFactor(.4);fg.fillStyle(cf.acc,.8);
  for(let i=0;i<40;i++)fg.fillRect(R()*(LW*.4+960),200+R()*250,2,2);
  const fog=this.add.rectangle(480,H-120,960,260,cf.fog,.18).setScrollFactor(0);
  this.tweens.add({targets:fog,alpha:.32,duration:3000,yoyo:true,repeat:-1});
  // terreno
  this.st=this.physics.add.staticGroup();
  const plat=(x,y,w,h)=>{this.st.create(x,y,'tile'+wi).setOrigin(0).setDisplaySize(w,h).refreshBody()};
  const segs=[];let x=0;
  while(x<LW-900){const len=320+(R()*280|0);plat(x,470,len,80);segs.push([x,len]);x+=len+(wi?90+(R()*(40+wi*8)|0):0)}
  plat(x,470,LW-x,80);const endSeg=[x,LW-x];this.endX=LW-160;
  this.spk=this.physics.add.staticGroup();
  if(wi>0)segs.forEach((g,i)=>{if(i>0&&R()<.7){const sx=g[0]+60+R()*(g[1]-140);this.spk.create(sx,470,'spk').setOrigin(.5,1).refreshBody()}});
  // plataformas flutuantes / móveis / temporárias
  this.mv=this.physics.add.group({allowGravity:false,immovable:true});this.dis=this.physics.add.group({allowGravity:false,immovable:true});
  const N=9;for(let i=0;i<N;i++){const px=500+i*(LW-1100)/N,py=330+R()*60;
   if(wi>=1&&i%3==1){const m=this.mv.create(px,py,'mv');m.x0=px;m.px=px;m.dx=0;m.setVelocityX(60)}
   else if(wi>=2&&i%3==2){this.dis.create(px,py,'dis')}
   else plat(px,py,96+(R()*64|0),14)}
  // checkpoint e altar
  this.cp={x:60,y:400};this.lamp=this.physics.add.staticSprite(LW/2,470-17,'lamp');
  this.altar=this.physics.add.staticSprite(LW-160,470-20,'caul');
  this.notes=this.physics.add.staticGroup();[.28,.72].forEach(f=>{this.notes.create(LW*f,470-10,'note')});
  // jogador
  this.p=this.physics.add.sprite(60,400,'p_idle_0');this.p.body.setSize(14,30).setOffset(5,2);
  this.physics.world.setBounds(0,-400,LW,H+500);this.physics.world.setBoundsCollision(true,true,true,false);this.p.setCollideWorldBounds(true);
  this.physics.add.collider(this.p,this.st);
  this.physics.add.collider(this.p,this.mv,(pl,m)=>{if(pl.body.touching.down)pl.x+=m.dx});
  this.physics.add.collider(this.p,this.dis,(pl,d)=>{if(!d.trig&&pl.body.touching.down){d.trig=true;
   this.tweens.add({targets:d,alpha:.2,duration:600,onComplete:()=>{d.disableBody(true,true);this.time.delayedCall(2200,()=>{d.enableBody(true,d.x,d.y,true,true);d.alpha=1;d.trig=false})}})}});
  this.physics.add.overlap(this.p,this.spk,()=>this.hurt());
  this.physics.add.overlap(this.p,this.lamp,()=>{if(this.cp.x!=this.lamp.x){this.cp={x:this.lamp.x,y:400};this.lamp.setTint(cf.acc);sfx(520,.3,'triangle',300)}});
  this.physics.add.overlap(this.p,this.notes,(pl,n)=>{n.destroy();this.pauseG();sfx(300,.4,'sine',-100);msgBox('Bilhete encontrado',cf.note,()=>this.resumeG())});
  // inimigos
  this.en=this.physics.add.group();
  segs.forEach((g,i)=>{if(i==0)return;const k=cf.en[(i+wi)%cf.en.length],ex=g[0]+g[1]/2;
   const e=this.en.create(ex,k=='bat'?330:440,'e_'+k+'_0');e.k=k;e.play('e_'+k);e.dir=R()<.5?-1:1;e.sp=40+wi*8;e.a=g[0]+30;e.b=g[0]+g[1]-30;
   e.x0=ex;e.y0=330;e.r=130;e.amp=40;e.ph=R()*6;e.body.setAllowGravity(k!='bat')});
  this.physics.add.collider(this.en,this.st);
  this.physics.add.overlap(this.p,this.en,(pl,e)=>{
   if(pl.body.velocity.y>80&&pl.y<e.y-6){e.disableBody(true,false);this.tweens.add({targets:e,alpha:0,scaleY:.1,duration:200,onComplete:()=>e.destroy()});pl.setVelocityY(-340);this.jc=1;sfx(260,.15,'square',-100)}
   else this.hurt()});
  this.cameras.main.setBounds(0,0,LW,H);this.cameras.main.startFollow(this.p,true,.12,.12);
  this.k=this.input.keyboard.addKeys('W,A,S,D,SPACE,SHIFT,E,P,UP,LEFT,RIGHT,ESC');
  this.pr=this.add.text(0,0,'Pressione E',{fontFamily:'Impact',fontSize:'18px',color:'#B7FF00'}).setOrigin(.5).setVisible(false);
  hud(this);$('hud').style.display='flex';$('pb').onclick=()=>this.pauseToggle();
  this.cameras.main.fadeIn(600);
  if(wi==0&&!S.introDone){S.introDone=1;this.pauseG();msgBox('Hollow Creek','Uma carta sem remetente trouxe você até aqui. O portão do laboratório se fecha atrás de você. Encontre bilhetes, acenda lanternas e chegue ao caldeirão de cada setor.',()=>this.resumeG())}
 }
 pauseG(){this.lock=true;this.physics.pause();window.T.l=window.T.r=window.T.j=0}
 resumeG(){this.lock=false;this.physics.resume()}
 pauseToggle(){if(this.finished)return;if(!this.lock){this.pauseG();$('pause').classList.add('on');$('rs').onclick=()=>{$('pause').classList.remove('on');this.resumeG()}}else if($('pause').classList.contains('on')){$('pause').classList.remove('on');this.resumeG()}}
 hurt(){const t=this.time.now;if(t<this.inv||this.lock)return;this.inv=t+1500;this.stunTo=t+350;this.lives(-1);sfx(160,.3,'sawtooth',-100);
  this.p.setVelocity(this.p.flipX?220:-220,-300);this.tweens.add({targets:this.p,alpha:.3,duration:100,yoyo:true,repeat:6,onComplete:()=>this.p.alpha=1});
  if(S.lives<=0)this.defeat()}
 lives(d){S.lives+=d;hud(this)}
 respawn(){this.p.setPosition(this.cp.x,this.cp.y).setVelocity(0,0);this.inv=this.time.now+1500;this.cameras.main.fadeIn(300)}
 defeat(){this.pauseG();this.p.anims.play('p_die');this.cameras.main.shake(300,.01);
  msgBox('Derrota','O laboratório registrou sua queda. Você retorna ao último ponto de recuperação.',()=>{S.lives=3;hud(this);this.respawn();this.resumeG()},'Voltar')}
 update(t,dt){
  const p=this.p,b=p.body,k=this.k,T=window.T;
  if(Phaser.Input.Keyboard.JustDown(k.P)||Phaser.Input.Keyboard.JustDown(k.ESC))this.pauseToggle();
  if(this.lock||this.finished)return;
  this.mv.getChildren().forEach(m=>{m.dx=m.x-m.px;m.px=m.x;if(m.x>m.x0+110)m.setVelocityX(-60);if(m.x<m.x0-110)m.setVelocityX(60)});
  this.en.getChildren().forEach(e=>{if(!e.active)return;
   if(e.k=='bat'){e.x+=e.dir*70*dt/1000;if(Math.abs(e.x-e.x0)>e.r)e.dir*=-1;e.y=e.y0+Math.sin(t/400+e.ph)*e.amp}
   else{e.setVelocityX(e.dir*e.sp);if(e.x<e.a)e.dir=1;if(e.x>e.b)e.dir=-1;if(e.k=='pump'&&b&&e.body.blocked.down&&Math.random()<.012)e.setVelocityY(-380)}
   e.setFlipX(e.dir>0)});
  if(p.y>560){this.lives(-1);sfx(120,.4,'sawtooth',-60);if(S.lives<=0)return this.defeat();this.respawn();return}
  const L=k.A.isDown||k.LEFT.isDown||T.l,Rr=k.D.isDown||k.RIGHT.isDown||T.r,run=k.SHIFT.isDown,sp=run?250:180,stun=t<this.stunTo;
  const on=b.blocked.down||b.touching.down;
  if(!stun){if(L){p.setVelocityX(-sp);p.setFlipX(true)}else if(Rr){p.setVelocityX(sp);p.setFlipX(false)}else p.setVelocityX(b.velocity.x*.6)}
  if(on){this.coy=t;this.jc=0;if(this.wasAir){this.landT=t+130;sfx(110,.08,'triangle',-30)}}this.wasAir=!on;
  const J=Phaser.Input.Keyboard.JustDown(k.SPACE)||Phaser.Input.Keyboard.JustDown(k.W)||Phaser.Input.Keyboard.JustDown(k.UP)||T.jp;T.jp=0;
  if(!stun&&J){if(on||t-this.coy<110){p.setVelocityY(-520);this.jc=1;sfx(380,.15,'square',300)}else if(this.jc<2){p.setVelocityY(-470);this.jc=2;sfx(520,.15,'square',300)}}
  if(!(k.SPACE.isDown||k.W.isDown||k.UP.isDown||T.j)&&b.velocity.y<-220)p.setVelocityY(b.velocity.y*.8);
  // interação
  const nearA=Math.abs(p.x-this.altar.x)<70;this.pr.setVisible(nearA).setPosition(this.altar.x,this.altar.y-50);
  if(nearA&&(Phaser.Input.Keyboard.JustDown(k.E)||T.e)){T.e=0;this.interact()}T.e=0;
  let a;if(stun)a='hurt';else if(t<this.acting)a='act';else if(!on)a=b.velocity.y<0?'jump':'fall';else if(t<this.landT)a='land';
  else if(Math.abs(b.velocity.x)>30)a=Math.abs(b.velocity.x)>200?'run':'walk';else a='idle';
  p.anims.play('p_'+a,true)}
 interact(){
  const wq=S.qs.filter(q=>q.world==this.wi+1&&!q.answered&&!S.ans[q.id]);
  this.acting=this.time.now+400;sfx(90,.4,'sawtooth',-30);this.pauseG();
  const go=()=>{this.finished=true;this.p.anims.play('p_cele');sfx(440,.6,'triangle',440);
   this.time.delayedCall(1800,()=>{this.cameras.main.fadeOut(600);this.time.delayedCall(650,()=>this.next())});this.resumeG();this.physics.pause()};
  if(!wq.length)return go();
  runQuiz(wq,()=>{wq.forEach(q=>S.ans[q.id]=1);go()})}
 next(){if(this.wi<4){const n=this.wi+1;$('hud').style.display='none';msgBox('Setor concluído','Você avançou para '+W[n].n+'.',()=>this.scene.start('L',{w:n}))}
  else this.finish()}
 async finish(){$('hud').style.display='none';
  try{const r=await rpc('finish_attempt',{p_attempt:S.att});
   $('et').textContent='Mortimer sorri na escuridão: cada resposta sua alimentou o último caldeirão. O experimento terminou — e o registro foi enviado ao professor.';
   $('en').textContent='Nota '+Number(r.score).toFixed(1).replace('.',',')+' / '+Number(r.max_score).toFixed(1).replace('.',',');
   $('ed').textContent=`Acertos: ${r.correct} · Erros: ${r.wrong} · Em branco: ${r.unanswered}`;
  }catch(e){$('et').textContent='Não foi possível registrar o resultado: '+e.message;$('en').textContent='';$('ed').textContent='Avise o professor.'}
  $('end').classList.add('on')}
}

// ====== LOGIN / INÍCIO ======
let game;
$('go').onclick=async()=>{
 $('err').textContent='';au();
 try{
  S.att=await rpc('start_attempt',{p_exam_code:$('ic').value,p_student_code:$('is').value,p_name:$('in').value});
  S.qs=await rpc('get_questions',{p_attempt:S.att});S.total=S.qs.length;S.done=S.qs.filter(q=>q.answered).length;S.ans={};
  if(!S.total)throw new Error('Esta avaliação ainda não tem questões.');
  const first=Math.max(0,Math.min(4,(S.qs.find(q=>!q.answered)||{world:1}).world-1));
  $('login').classList.remove('on');
  game=new Phaser.Game({type:Phaser.AUTO,parent:'game',pixelArt:true,backgroundColor:'#09070D',
   scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH,width:960,height:540},
   physics:{default:'arcade',arcade:{gravity:{y:1150},debug:false}},scene:[],callbacks:{postBoot:g=>{g.scene.add('L',L,true,{w:first})}}});
 }catch(e){$('err').textContent=e.message}};
// controles de toque
const hold=(id,k)=>{const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();au();T[k]=1;if(k=='j')T.jp=1});['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>{if(k!='e')T[k]=0}))};
hold('tl','l');hold('tr','r');hold('tj','j');hold('te','e');

<script type="text/plain" id="src-painel"><!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel do Professor — O Último Caldeirão</title>
<style>
:root{--p:#210B38;--r:#FF4D6A;--g:#D71936;--k:#09070D;--d:#19151F;--w:#E8E2DC}
*{box-sizing:border-box}
body{margin:0;background:var(--k);color:var(--w);font:15px/1.45 Georgia,serif}
h1,h2,h3{font-family:Impact,'Arial Narrow',sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--g);margin:0 0 12px}

#app{display:none;min-height:100vh}

@media(max-width:760px){nav{position:static;width:auto;display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto}main{margin:0;padding:14px}}

.card{background:var(--d);border:1px solid var(--p);padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

</style></head><body>

<div id="auth">
 <h2 id="at">Painel do Professor</h2>
 <label>E-mail</label><input id="em" type="email" autocomplete="username">
 <label>Senha</label><input id="pw" type="password" autocomplete="current-password">
 <div id="invw" style="display:none"><label>Código de convite de professor</label><input id="inv"></div>
 <p><button id="ab" style="width:100%">Entrar</button></p>
 <p id="msg"></p>
 <p><a href="#" id="tg" style="color:var(--g)">Criar conta de professor</a></p>
</div>

<div id="app">
 <nav>
  <h3>Caldeirão</h3>
  <button data-v="dash">Painel</button><button data-v="exams">Provas</button><button data-v="qs">Questões</button>
  <button data-v="studs">Alunos</button><button data-v="res">Resultados</button><button id="out">Sair</button>
 </nav>
 <main id="v"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>
<script>
// ====== CONFIGURAÇÃO: mesmos dados do jogo (Settings > API) ======
const CFG={URL:'COLE_AQUI_A_URL_DO_SUPABASE',KEY:'COLE_AQUI_A_ANON_KEY'};
// =================================================================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':Number(n).toFixed(1).replace('.',',');
const dt=s=>s?new Date(s).toLocaleString('pt-BR'):'—';
let SS=JSON.parse(localStorage.getItem('ss')||'null');
const ST={exams:[],ex:null,mode:'in'};
const HD=t=>({apikey:CFG.KEY,Authorization:'Bearer '+(t||CFG.KEY),'Content-Type':'application/json'});
async function auth(p,b){
 if(CFG.URL.startsWith('COLE'))throw new Error('Configure CFG.URL e CFG.KEY no início do script.');
 const r=await fetch(CFG.URL+'/auth/v1/'+p,{method:'POST',headers:HD(),body:JSON.stringify(b)});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.error_description||j.message||'Erro de autenticação');return j}
async function refresh(){SS=await auth('token?grant_type=refresh_token',{refresh_token:SS.refresh_token});localStorage.setItem('ss',JSON.stringify(SS))}
async function api(m,p,b,pref,retry=1){
 const r=await fetch(CFG.URL+'/rest/v1/'+p,{method:m,headers:{...HD(SS&&SS.access_token),Prefer:pref||'return=representation'},body:b!==undefined?JSON.stringify(b):undefined});
 if(r.status==401&&retry&&SS){try{await refresh()}catch(e){logout();throw new Error('Sessão expirada')}return api(m,p,b,pref,0)}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((j&&(j.message||j.msg))||'Erro '+r.status);return j}
const rpc=(f,a)=>api('POST','rpc/'+f,a||{});

// ====== AUTENTICAÇÃO / CONTA ======
$('#tg').onclick=e=>{e.preventDefault();ST.mode=ST.mode=='in'?'up':'in';const up=ST.mode=='up';
 $('#invw').style.display=up?'block':'none';$('#ab').textContent=up?'Criar conta':'Entrar';$('#tg').textContent=up?'Já tenho conta':'Criar conta de professor';$('#msg').textContent=''};
$('#ab').onclick=async()=>{
 $('#msg').textContent='';const email=$('#em').value.trim(),password=$('#pw').value;
 try{
  if(ST.mode=='up'){
   if(password.length<8)throw new Error('Use uma senha com 8 ou mais caracteres.');
   if(!$('#inv').value)throw new Error('Informe o código de convite.');
   const j=await auth('signup',{email,password});
   if(!j.access_token){sessionStorage.setItem('inv',$('#inv').value);throw new Error('Conta criada. Confirme o e-mail, depois entre — o convite será aplicado no primeiro acesso.')}
   SS=j;localStorage.setItem('ss',JSON.stringify(j));await rpc('register_teacher',{p_code:$('#inv').value});
  }else{
   SS=await auth('token?grant_type=password',{email,password});localStorage.setItem('ss',JSON.stringify(SS));
   if(!(await rpc('is_teacher'))){const c=sessionStorage.getItem('inv')||prompt('Esta conta ainda não é de professor. Informe o código de convite:');
    if(!c)throw new Error('Acesso restrito a professores.');await rpc('register_teacher',{p_code:c});sessionStorage.removeItem('inv')}
  }
  boot()
 }catch(e){$('#msg').textContent=e.message;if(ST.mode=='in'&&SS&&!/convite|Convite/.test(e.message))logout(1)}};
function logout(q){SS=null;localStorage.removeItem('ss');if(!q){$('#app').style.display='none';$('#auth').style.display='block'}}
$('#out').onclick=()=>logout();
async function boot(){
 try{if(!SS)return;if(!(await rpc('is_teacher'))){logout(1);return}
  $('#auth').style.display='none';$('#app').style.display='block';go('dash')}catch(e){logout(1)}}
document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
async function go(v){document.querySelectorAll('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==v));
 ST.exams=await api('GET','exams?select=*,questions(count)&order=created_at.desc');
 if(!ST.ex||!ST.exams.find(e=>e.id==ST.ex))ST.ex=ST.exams[0]?.id||null;
 try{await V[v]()}catch(e){$('#v').innerHTML='<p class=er>'+esc(e.message)+'</p>'}}
const exSel=()=>`<select onchange="ST.ex=this.value;go(CUR)">${ST.exams.map(e=>`<option value="${e.id}" ${e.id==ST.ex?'selected':''}>${esc(e.name)} (${esc(e.code)})</option>`).join('')}</select>`;
let CUR='dash';
const noEx=()=>'<p>Crie uma prova primeiro (menu Provas).</p>';

const V={
// ---- Painel ----
async dash(){CUR='dash';
 const [st,at]=await Promise.all([api('GET','students?select=id'),api('GET','attempts?select=*,exams(max_score)&status=eq.finished')]);
 const sc=at.map(a=>+a.score),pc=at.map(a=>{const t=a.correct_count+a.wrong_count+a.unanswered_count;return t?a.correct_count/t*100:0});
 const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
 const bins=[0,0,0,0,0];pc.forEach(p=>bins[Math.min(4,p/20|0)]++);const mx=Math.max(1,...bins);
 $('#v').innerHTML=`<h2>Painel</h2><div class="grid">
 <div class="card kpi"><b>${st.length}</b>alunos cadastrados</div><div class="card kpi"><b>${at.length}</b>provas realizadas</div>
 <div class="card kpi"><b>${fmt(avg(sc))}</b>média geral</div><div class="card kpi"><b>${at.length?fmt(Math.max(...sc)):'—'}</b>maior nota</div>
 <div class="card kpi"><b>${at.length?fmt(Math.min(...sc)):'—'}</b>menor nota</div><div class="card kpi"><b>${pc.length?Math.round(avg(pc))+'%':'—'}</b>acertos (média)</div>
 <div class="card kpi"><b>${at.length}</b>concluíram o jogo</div></div>
 <div class="card"><h3>Distribuição do aproveitamento</h3><div class="bar">${bins.map((n,i)=>`<div style="height:${n/mx*100}%">${n}</div>`).join('')}</div>
 <div class="bar" style="height:auto;margin:2px 0 0">${['0–20%','20–40%','40–60%','60–80%','80–100%'].map(t=>`<div style="background:none;color:#888">${t}</div>`).join('')}</div></div>`},

// ---- Provas ----
async exams(){CUR='exams';
 $('#v').innerHTML=`<h2>Provas</h2><button onclick="exForm()">+ Nova prova</button><div id="f"></div>
 <table><tr><th>Nome</th><th>Código</th><th>Nota máx.</th><th>Questões</th><th>Ativa</th><th></th></tr>
 ${ST.exams.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.code)}</td><td>${fmt(e.max_score)}</td><td>${e.questions[0].count}</td><td>${e.active?'sim':'não'}</td>
 <td class="row"><button class=s onclick="ST.ex='${e.id}';go('qs')">Questões</button><button class=s onclick="exForm('${e.id}')">Editar</button><button class=s onclick="exDel('${e.id}')">Excluir</button></td></tr>`).join('')}</table>`},

// ---- Questões ----
async qs(){CUR='qs';
 if(!ST.ex){$('#v').innerHTML='<h2>Questões</h2>'+noEx();return}
 ST.q=await api('GET',`questions?exam_id=eq.${ST.ex}&select=*,question_options(*),question_keys(correct_label)&order=world,position`);
 const ex=ST.exams.find(e=>e.id==ST.ex),tw=ST.q.reduce((s,q)=>s+ +q.weight,0);
 $('#v').innerHTML=`<h2>Questões</h2><div class="row">${exSel()}<button onclick="qForm()">+ Nova questão</button></div>
 <p>${ST.q.length} questões · soma dos pesos ${fmt(tw)} · nota máxima ${fmt(ex.max_score)}</p><div id="f"></div>
 ${[1,2,3,4,5].map(w=>{const l=ST.q.filter(q=>q.world==w);return l.length?`<h3>Mundo ${w}</h3>`+l.map(q=>`<div class="card"><b>#${q.position}</b> ${esc(q.statement)}
 <div style="opacity:.8;font-size:.85rem">${esc(q.topic||'')} · dificuldade ${q.difficulty} · peso ${fmt(q.weight)} · correta: ${esc(q.question_keys?.correct_label||'—')}</div>
 <div class="row np" style="margin-top:6px"><button class=s onclick="qForm('${q.id}')">Editar</button><button class=s onclick="qDel('${q.id}')">Excluir</button></div></div>`).join(''):''}).join('')}`},

// ---- Alunos ----
async studs(){CUR='studs';
 const s=await api('GET','students?select=*&order=full_name');
 $('#v').innerHTML=`<h2>Alunos</h2><div class="card"><h3>Adicionar</h3><div class="row"><input id="sn" placeholder="Nome completo" style="flex:2"><input id="sc" placeholder="Código (vazio = gerar)" style="flex:1"><button onclick="sAdd()">Adicionar</button></div>
 <label>Ou cole vários (um por linha: Nome; código — o código é opcional)</label><textarea id="sb"></textarea><button onclick="sBulk()">Importar lista</button><p id="msg"></p></div>
 <table><tr><th>Nome</th><th>Código de acesso</th><th></th></tr>${s.map(x=>`<tr><td>${esc(x.full_name)}</td><td><code>${esc(x.code)}</code></td><td><button class=s onclick="sDel('${x.id}')">Excluir</button></td></tr>`).join('')}</table>`},

// ---- Resultados ----
async res(){CUR='res';
 if(!ST.ex){$('#v').innerHTML='<h2>Resultados</h2>'+noEx();return}
 ST.at=await api('GET',`attempts?exam_id=eq.${ST.ex}&select=*,students(full_name,code)&order=started_at.desc`);
 const ex=ST.exams.find(e=>e.id==ST.ex);
 $('#v').innerHTML=`<h2>Resultados</h2><div class="row np">${exSel()}<button onclick="exp('csv')">CSV</button><button onclick="exp('xlsx')">Excel</button><button onclick="print()">PDF / Imprimir</button></div>
 <p>${esc(ex.name)} · nota máxima ${fmt(ex.max_score)} · ${ST.at.length} tentativas</p>
 <table><tr><th>Aluno</th><th>Acertos</th><th>Erros</th><th>Em branco</th><th>Nota</th><th>%</th><th>Conclusão</th></tr>
 ${ST.at.map(a=>{const t=(a.correct_count||0)+(a.wrong_count||0)+(a.unanswered_count||0);return `<tr class="cl" onclick="det('${a.id}')"><td>${esc(a.students.full_name)}</td><td>${a.correct_count??'—'}</td><td>${a.wrong_count??'—'}</td><td>${a.unanswered_count??'—'}</td><td>${fmt(a.score)}</td><td>${a.status=='finished'&&t?Math.round(a.correct_count/t*100)+'%':'—'}</td><td>${a.status=='finished'?'Concluído':'Em andamento'}</td></tr>`}).join('')}</table><div id="d"></div>`}
};

// ====== PROVAS: CRUD ======
const loc=s=>s?new Date(new Date(s)-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
window.exForm=id=>{const e=ST.exams.find(x=>x.id==id)||{max_score:10,active:true,allow_retry:false};
 $('#f').innerHTML=`<div class="card"><h3>${id?'Editar':'Nova'} prova</h3><div class="two"><div><label>Nome</label><input id="xn" value="${esc(e.name)}" style="width:100%"></div>
 <div><label>Código de acesso do aluno</label><input id="xc" value="${esc(e.code)}" style="width:100%"></div></div>
 <label>Descrição</label><textarea id="xd">${esc(e.description)}</textarea>
 <div class="two"><div><label>Nota máxima</label><input id="xm" type="number" step="0.5" min="0.5" value="${e.max_score}"></div><div></div>
 <div><label>Disponível a partir de</label><input id="xs" type="datetime-local" value="${loc(e.starts_at)}"></div><div><label>Disponível até</label><input id="xe" type="datetime-local" value="${loc(e.ends_at)}"></div></div>
 <label><input id="xa" type="checkbox" ${e.active?'checked':''}> Prova ativa</label><label><input id="xr" type="checkbox" ${e.allow_retry?'checked':''}> Permitir novas tentativas</label>
 <p><button onclick="exSave('${id||''}')">Salvar</button> <button onclick="go('exams')">Cancelar</button></p><p id="msg"></p></div>`};
window.exSave=async id=>{
 const b={name:$('#xn').value.trim(),code:$('#xc').value.trim().toUpperCase(),description:$('#xd').value,max_score:+$('#xm').value,active:$('#xa').checked,allow_retry:$('#xr').checked,
  starts_at:$('#xs').value?new Date($('#xs').value).toISOString():null,ends_at:$('#xe').value?new Date($('#xe').value).toISOString():null};
 try{if(!b.name||!b.code)throw new Error('Informe nome e código.');
  id?await api('PATCH','exams?id=eq.'+id,b):await api('POST','exams',b);go('exams')}catch(e){$('#msg').textContent=e.message}};
window.exDel=async id=>{if(confirm('Excluir a prova, as questões e todas as tentativas dos alunos? Não há como desfazer.')){await api('DELETE','exams?id=eq.'+id);go('exams')}};

// ====== QUESTÕES: CRUD ======
window.qForm=id=>{const q=ST.q.find(x=>x.id==id)||{world:1,position:(ST.q.length+1),difficulty:1,weight:1,question_options:[],question_keys:null};
 const o=l=>q.question_options.find(x=>x.label==l)?.text||'',ck=q.question_keys?.correct_label;
 $('#f').innerHTML=`<div class="card"><h3>${id?'Editar':'Nova'} questão</h3>
 <div class="two"><div><label>Mundo</label><select id="qw">${[1,2,3,4,5].map(w=>`<option ${w==q.world?'selected':''}>${w}</option>`).join('')}</select></div>
 <div><label>Posição no mundo</label><input id="qp" type="number" value="${q.position}"></div>
 <div><label>Dificuldade</label><select id="qd">${[[1,'Fácil'],[2,'Média'],[3,'Difícil']].map(([v,t])=>`<option value="${v}" ${v==q.difficulty?'selected':''}>${t}</option>`).join('')}</select></div>
 <div><label>Valor (peso)</label><input id="qv" type="number" step="0.25" min="0.25" value="${q.weight}"></div></div>
 <label>Assunto</label><input id="qt" value="${esc(q.topic)}" style="width:100%" placeholder="Ex.: Ligações químicas">
 <label>Enunciado</label><textarea id="qs">${esc(q.statement)}</textarea>
 ${'ABCDE'.split('').map(l=>`<div class="row" style="margin-top:6px"><input type="radio" name="qk" value="${l}" ${ck==l?'checked':''}><b>${l}</b><input id="o${l}" value="${esc(o(l))}" style="flex:1" placeholder="Alternativa ${l}${'AB'.includes(l)?'':' (opcional)'}"></div>`).join('')}
 <label>Explicação da resposta (só o professor vê)</label><textarea id="qe">${esc(q.explanation)}</textarea>
 ${id?'<p style="font-size:.8rem;opacity:.7">Alterar o gabarito não recalcula tentativas já finalizadas.</p>':''}
 <p><button onclick="qSave('${id||''}')">Salvar questão</button> <button onclick="go('qs')">Cancelar</button></p><p id="msg"></p></div>`;scrollTo(0,0)};
window.qSave=async id=>{
 try{const ops=[...'ABCDE'].map(l=>({l,t:$('#o'+l).value.trim()})),k=document.querySelector('[name=qk]:checked')?.value;
  const q={exam_id:ST.ex,world:+$('#qw').value,position:+$('#qp').value,difficulty:+$('#qd').value,weight:+$('#qv').value,topic:$('#qt').value.trim()||null,statement:$('#qs').value.trim(),explanation:$('#qe').value.trim()||null};
  if(!q.statement)throw new Error('Escreva o enunciado.');
  if(ops.filter(o=>o.t).length<2)throw new Error('Informe ao menos duas alternativas.');
  if(!k||!ops.find(o=>o.l==k).t)throw new Error('Marque a alternativa correta (e preencha o texto dela).');
  let qid=id;
  if(id){delete q.exam_id;await api('PATCH','questions?id=eq.'+id,q)}else qid=(await api('POST','questions',q))[0].id;
  await api('POST','question_options?on_conflict=question_id,label',ops.filter(o=>o.t).map(o=>({question_id:qid,label:o.l,text:o.t})),'resolution=merge-duplicates,return=minimal');
  await api('POST','question_keys?on_conflict=question_id',{question_id:qid,correct_label:k},'resolution=merge-duplicates,return=minimal');
  for(const o of ops.filter(o=>!o.t))try{await api('DELETE',`question_options?question_id=eq.${qid}&label=eq.${o.l}`)}catch(e){}
  go('qs')}catch(e){$('#msg').textContent=e.message}};
window.qDel=async id=>{if(confirm('Excluir esta questão? As respostas dos alunos a ela também serão apagadas.')){await api('DELETE','questions?id=eq.'+id);go('qs')}};

// ====== ALUNOS ======
const gen=()=>Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
window.sAdd=async()=>{try{const n=$('#sn').value.trim();if(!n)throw new Error('Informe o nome.');await api('POST','students',{full_name:n,code:($('#sc').value.trim()||gen()).toUpperCase()});go('studs')}catch(e){$('#msg').textContent=e.message}};
window.sBulk=async()=>{try{const r=$('#sb').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/[;\t,]/);return{full_name:p[0].trim(),code:(p[1]?.trim()||gen()).toUpperCase()}});
 if(!r.length)throw new Error('Cole ao menos um nome.');await api('POST','students',r,'return=minimal');go('studs')}catch(e){$('#msg').textContent=e.message}};
window.sDel=async id=>{if(confirm('Excluir aluno e suas tentativas?')){await api('DELETE','students?id=eq.'+id);go('studs')}};

// ====== RESULTADOS: DETALHE E EXPORTAÇÃO ======
window.det=async id=>{const a=ST.at.find(x=>x.id==id),r=await api('GET',`error_report?attempt_id=eq.${id}&order=world,position`);
 const t=a.finished_at?Math.round((new Date(a.finished_at)-new Date(a.started_at))/1000):null,wrong=r.filter(x=>!x.is_correct);
 $('#d').innerHTML=`<div class="card"><h2>${esc(a.students.full_name)}</h2>
 <p>Identificação: <code>${esc(a.students.code)}</code> · Início: ${dt(a.started_at)} · Conclusão: ${dt(a.finished_at)} · Tempo: ${t==null?'—':Math.floor(t/60)+'min '+t%60+'s'}<br>
 Respondidas: ${r.length} · Acertos: <span class=ok>${a.correct_count??r.length-wrong.length}</span> · Erros: <span class=er>${a.wrong_count??wrong.length}</span> · Nota: <b>${fmt(a.score)}</b> / ${fmt(ST.exams.find(e=>e.id==ST.ex).max_score)}</p>
 <h3>Questões incorretas (${wrong.length})</h3>${wrong.map(x=>`<div class="card"><b>Mundo ${x.world} · Questão ${x.position}</b> — ${esc(x.topic||'')}<br>${esc(x.statement)}<br>
 Escolhida: <span class=er>${esc(x.chosen)}</span> · Correta: <span class=ok>${esc(x.correct_label)}</span>${x.explanation?'<br><i>'+esc(x.explanation)+'</i>':''}</div>`).join('')||'<p>Nenhum erro.</p>'}
 <h3>Histórico de respostas</h3><table><tr><th>Mundo</th><th>Questão</th><th>Assunto</th><th>Escolhida</th><th>Correta</th><th>Resultado</th><th>Horário</th></tr>
 ${r.map(x=>`<tr><td>${x.world}</td><td>${x.position}</td><td>${esc(x.topic||'')}</td><td>${esc(x.chosen)}</td><td>${esc(x.correct_label)}</td><td class="${x.is_correct?'ok':'er'}">${x.is_correct?'Acerto':'Erro'}</td><td>${dt(x.answered_at)}</td></tr>`).join('')}</table>
 <button class="np" onclick="print()">Imprimir relatório do aluno</button></div>`;$('#d').scrollIntoView()};
window.exp=f=>{const rows=ST.at.map(a=>{const t=(a.correct_count||0)+(a.wrong_count||0)+(a.unanswered_count||0);return{Aluno:a.students.full_name,Código:a.students.code,Acertos:a.correct_count,Erros:a.wrong_count,'Em branco':a.unanswered_count,Nota:a.score,'Aproveitamento %':a.status=='finished'&&t?Math.round(a.correct_count/t*100):null,Início:dt(a.started_at),Conclusão:dt(a.finished_at),Status:a.status=='finished'?'Concluído':'Em andamento'}});
 if(!rows.length)return alert('Sem dados para exportar.');
 if(f=='xlsx'){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Resultados');XLSX.writeFile(wb,'resultados.xlsx')}
 else{const h=Object.keys(rows[0]),c=v=>'"'+String(v??'').replace(/"/g,'""')+'"',s='\ufeff'+[h.map(c).join(';'),...rows.map(r=>h.map(k=>c(r[k])).join(';'))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));a.download='resultados.csv';a.click()}};
boot();
<\/script></body></html>
</script>
<script>
// ====== CONFIGURAÇÃO ÚNICA: cole aqui a URL e a chave anon public do Supabase ======
const CFG={URL:'COLE_AQUI_A_URL_DO_SUPABASE',KEY:'COLE_AQUI_A_ANON_KEY'};
// ====================================================================================
const $=id=>document.getElementById(id);
let cur='';
function src(n){
 return $('src-'+n).textContent.replace(/<\\\/script/g,'</script').replace(/const CFG=\{[^}]*\};/,'const CFG='+JSON.stringify(CFG)+';');
}
function show(){
 const h=location.hash.slice(1),n=(h=='jogo'||h=='painel')?h:'';
 if(n==cur)return;cur=n;
 $('menu').style.display=n?'none':'flex';
 $('fr').style.display=$('mn').style.display=n?'block':'none';
 $('fr').srcdoc=n?src(n):'';
 document.title=n=='painel'?'Painel do Professor — O Último Caldeirão':'Halloween — O Último Caldeirão';
}
$('bj').onclick=()=>location.hash='jogo';
$('bp').onclick=()=>location.hash='painel';
$('mn').onclick=()=>location.hash='';
addEventListener('hashchange',show);show();
</script>
</body></html>
