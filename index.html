<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Mansão do Dr. Eletrônio</title>
<meta name="description" content="Prova bimestral de Química: eletronegatividade, 1º ano do ensino médio.">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#050308;--card:#0e0916;--tx:#f1ecf8;--mut:#9d8fb5;--ac:#b8ff1a;--ac2:#8a2be2;--bad:#ff5470;--ln:#4b2a7a}
*{box-sizing:border-box;border-radius:0!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.55 Arial,Helvetica,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font:900 2rem/1.05 Impact,'Arial Black',Arial,sans-serif;letter-spacing:.5px;color:var(--tx);margin:.3em 0 .2em}
h2{font:700 1.1rem Arial,sans-serif;color:var(--ac);margin:.2em 0 .6em}
.card{background:var(--card);border:2px solid var(--ln);box-shadow:6px 6px 0 var(--ac2);padding:20px;margin:18px 0}
.story{border:1px solid var(--ln);background:#000;padding:12px 14px;font:normal .95rem/1.6 'Courier New',Courier,monospace;color:#c9bbe8}
input,textarea,button,select{font:inherit;border:2px solid var(--ln);padding:10px 12px;background:#000;color:var(--tx);width:100%;margin:6px 0}
textarea{min-height:90px}
button{background:var(--ac);color:#050308;border:2px solid var(--ac);font-weight:800;padding:12px 16px;cursor:pointer}
button:hover:not(:disabled){background:#050308;color:var(--ac)}
button:disabled{opacity:.4;cursor:not-allowed}
button.sec{background:transparent;color:var(--tx);border:2px solid var(--ln);width:auto;margin-right:6px}
button.sec:hover{border-color:var(--ac);color:var(--ac)}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#000;border:2px solid var(--ln);color:var(--tx);font-weight:500}
.opt:hover:not(:disabled){background:#000;color:var(--tx);border-color:var(--ac2)}
.opt.on,.opt.on:hover{background:#12091f;border-color:var(--ac);color:var(--tx)}
.ltr{flex:none;width:28px;height:28px;display:grid;place-items:center;background:var(--ln);color:var(--tx);font-weight:800}
.opt.on .ltr{background:var(--ac);color:#050308}
.seg{display:flex;gap:4px;margin:10px 0 0}.seg i{flex:1;height:10px;background:var(--ln)}.seg i.d{background:var(--ac2)}.seg i.c{background:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:6px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--ac)}
.wrap{overflow-x:auto}.err{color:var(--bad)}.ok{color:var(--ac)}.code{font:700 1.1rem monospace;word-break:break-all;color:var(--ac2)}
.w{width:80px;margin:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.pad{display:flex;gap:8px;margin-top:12px}.pad button{width:auto;flex:1;margin:0;padding:18px 0;touch-action:none;user-select:none}
</style>
</head>
<body>
<main id="app"></main>

const INTRO="Na noite de Halloween, você entra na mansão abandonada do Dr. Eletrônio Von Atrakt, um cientista louco que roubou os elétrons da cidade para ressuscitar seus monstros. A porta se tranca atrás de você! Para fugir, é preciso abrir 10 portas assombradas, cada uma com uma pergunta de química. Cuidado: a mansão não avisa se você errou…";
const Q=[
{s:"Uma porta coberta de teias exibe uma inscrição brilhante: a fechadura só abre para quem souber a resposta.",
 t:"O que é eletronegatividade?",o:["A capacidade de um átomo perder prótons","A tendência de um átomo atrair elétrons em uma ligação química","A quantidade de nêutrons do núcleo","A massa atômica de um elemento"],a:1},
{s:"A porta range e revela uma cripta de frascos borbulhantes e luz verde. Uma risada ecoa: “Só passa quem conhece o rei dos elétrons!”",

{s:"Na parede, um líquido verde-ácido desenha setas sobre uma tabela periódica rasgada, mas elas estão embaralhadas.",

{s:"Quatro caldeirões fumegantes precisam ser alinhados na mesa do ritual: do que menos atrai elétrons ao que mais atrai.",

{s:"No corredor sombrio, um frasco de ácido clorídrico vaza e uma névoa roxa sobe. Uma voz grita: “Quem fica com o elétron na molécula de HCl?”",
 t:"Na molécula de HCl, o cloro é mais eletronegativo que o hidrogênio. O que ocorre?",o:["O cloro fica com carga parcial negativa e o hidrogênio com parcial positiva","O hidrogênio fica com carga parcial negativa","Os dois ficam neutros, sem nenhuma polaridade","O hidrogênio transfere os prótons para o cloro"],a:0},
{s:"Você chega ao porão do gerador, cheio de teias. Dois átomos idênticos de cloro formam o cadeado da porta.",

{s:"A mansão começa a inundar de uma água escura e a única saída é pela válvula da molécula de água.",

function hash(s){let h=5381;for(const c of s+"ELETRO26")h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36).toUpperCase().padStart(5,"0").slice(-5)}

<div class="err">${msg}</div><button onclick="login()">Começar</button></div>

const SB="https://jzalzkcbsmvqjrycjdrx.supabase.co",KEY="sb_publishable_bmOzl_lwm0tAWEMf3barnQ_C-jEVBVB";
async function rpc(fn,a){const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(a||{})});const t=await r.text();if(!r.ok)throw new Error(t||r.status);return t?JSON.parse(t):null}
async function login(){
const n=$("nm").value,c=$("cd").value.trim().toUpperCase();
if(!n.trim()||hash(norm(n))!==c)return home("Nome ou código inválido. Confira com seu professor.");
const done=ls("done_"+c);if(done){try{if(done.sent&&!await rpc("ja_enviou",{p_codigo:c})){ls("done_"+c,null);ls("st_"+c,null)}else return finish(done)}catch(e){return finish(done)}}
try{if(!await rpc("existe",{p_codigo:c}))return home("Este código não está cadastrado. Fale com o professor.");

st=ls("st_"+c)||{n:n.trim(),c,i:0,a:Q.map(()=>null),p:perm(c),op:ops(c)};if(!st.p)st.p=Q.map((_,i)=>i);if(!st.op)st.op=ops(c);q()}
function rng(seed){let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;return()=>{h=(h+0x6D2B79F5)>>>0;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuf(n,r){const m=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[m[i],m[j]]=[m[j],m[i]]}return m}
function perm(c){return shuf(Q.length,rng(c+"PROVA"))}
function ops(c){const r=rng(c+"OPCOES");return Q.map(()=>shuf(4,r))}

/* FUNDO: CIDADE ROXA */
let BGS,BGF,BGN,GRD,BGH;
function city(far,seed,win){
 const cv=mkc(TW,GH),c=cv.getContext("2d"),r=rng(seed),u=24;
 const g=c.createLinearGradient(0,60,0,330);
 if(far){g.addColorStop(0,"rgba(110,30,230,.55)");g.addColorStop(1,"rgba(50,0,130,.6)")}else{g.addColorStop(0,"#6a10ff");g.addColorStop(1,"#3a0098")}
 const wg=c.createLinearGradient(0,100,0,320);wg.addColorStop(0,"#00ffcc");wg.addColorStop(1,"#1fa8d8");
 const pg=c.createLinearGradient(0,200,0,330);pg.addColorStop(0,"#9a3cff");pg.addColorStop(1,"#6a1fd0");
 let x=far?30:0;
 while(x<TW-260){
  const w=Math.floor(3+r()*3),t=Math.floor(r()*4);
  let hh=(far?4:5)+Math.floor(r()*(far?5:6));if(t===1)hh=Math.max(hh,w+2);
  const h=hh*u,W=w*u;
  if(x+W+u>TW-8)break;
  c.fillStyle=g;
  if(t===0){c.fillRect(x,320-h,W,h);c.fillRect(x+u,320-h-u,W-2*u,u);c.fillRect(x+Math.floor(w/2)*u,320-h-3*u,u,2*u);
   if(win){c.fillStyle=wg;for(let yy=320-h+u;yy<320-2*u;yy+=2*u){if(r()<.85)c.fillRect(x+u/2,yy,u*.8,u*.8);if(r()<.85)c.fillRect(x+W-u/2-u*.8,yy,u*.8,u*.8)}}}
  else if(t===1){for(let i=0;i<w;i++)c.fillRect(x+i*u,320-h+i*u,u,h-i*u)}
  else if(t===2){c.fillRect(x+(Math.floor(w/2))*u,320-h,u,h);c.fillRect(x,320-h,W,u);c.fillStyle=wg;c.fillRect(x+u/2,320-h-u*1.5,W-u,u*1.5)}
  else{const hp=Math.min(h,u*5);c.fillStyle=far?g:pg;c.fillRect(x,320-hp,W,hp);if(win){for(let i=0;i<3;i++){const yy=320-hp+u*.6+i*u*1.4;const bg=c.createLinearGradient(x,0,x+W,0);bg.addColorStop(0,"#ff2fd0");bg.addColorStop(1,"#e87fff");c.fillStyle=bg;c.fillRect(x+u*.8,yy,W-u*.8,u*.7)}}}
  x+=W+(Math.floor(r()*3))*u+(far?2*u:u/2)}
 return cv}
function buildBG(){
 BGS=mkc(GW,GH);const c=BGS.getContext("2d");
 const g=c.createLinearGradient(0,0,0,GH);g.addColorStop(0,"#00001f");g.addColorStop(.4,"#14003e");g.addColorStop(.75,"#34007a");g.addColorStop(1,"#5010b0");
 c.fillStyle=g;c.fillRect(0,0,GW,GH);
 const r=rng("ESTRELAS");c.fillStyle="#18a8ff";
 for(let i=0;i<34;i++){const s=r()<.2?6:r()<.5?4:2;c.fillRect(Math.floor(r()*GW),Math.floor(r()*190),s,s)}
 BGF=city(1,"FAR",false);BGN=city(0,"NEAR",true);
 GRD=c.createLinearGradient(0,320,0,400);GRD.addColorStop(0,"#8a3cff");GRD.addColorStop(1,"#5016c0")}
function drawBG(c,cam){
 c.drawImage(BGS,0,0);
 [[BGF,.2],[BGN,.5]].forEach(([L,f])=>{const ox=-((cam*f)%TW);c.drawImage(L,ox,0);c.drawImage(L,ox+TW,0)})}
function ground(c,x,s){c.fillStyle=GRD;c.fillRect(x,s.y,s.w,s.h);c.fillStyle="#c27aff";c.fillRect(x,s.y,s.w,4);c.fillStyle="rgba(255,255,255,.07)";for(let i=0;i<s.w;i+=48)c.fillRect(x+i,s.y+20,24,4)}

  so.push({x,y:320,w:rl,h:80});

  if(!first&&!fin){
   const f=r();let tube=false;
   if(k>0&&f>=.55&&f<.8){const th=k>=5&&r()<.5?60:40;so.push({x:Math.floor(x+rl*.3),y:320-th,w:40,h:th,t:1});tube=true}

if(b.s==="slamw"||b.s==="slam"){c.beginPath();c.ellipse(b.s==="slam"?b.tgt:p.x+11,318,54,8,0,0,7);c.stroke()}
c.setLineDash([]);
// rastro de desvio / investida
b.tr.forEach((g,i)=>{if(!BC)return;c.globalAlpha=.1+.28*i/b.tr.length;bossImg(c,BC,g.x,g.fy,g.f,g.an,0,false)});c.globalAlpha=1;
if(b.hp>0||(p.wt%6<3)){
 const sh=b.rise<1?(1-b.rise)*40:0;
 bossImg(c,b.flash>0&&b.flash%4<2&&BR?BR:BI,b.x,b.fy,b.f,an,sh,b.rise<1);
 if(ch&&b.hp>0){const gl=b.s==="orbs"?Math.min(1,b.t/24):1;c.fillStyle="rgba(184,255,26,"+(.18+.14*Math.sin(T/40))+")";c.beginPath();c.arc(tipX,tipY,12+14*gl,0,7);c.fill();bolt(c,tipX,tipY,tipX+(Math.random()-.5)*60,tipY-28-Math.random()*22,2)}
 if(b.s==="dash"||b.s==="stun"&&b.t%6<3){bolt(c,b.x-b.f*20,b.fy-20,b.x-b.f*(50+Math.random()*30),b.fy-10-Math.random()*50,2)}
 if(b.s==="roar"){for(let i=0;i<5;i++)bolt(c,tipX,tipY,tipX+(Math.random()-.5)*260,tipY-60-Math.random()*60,3)}}
drawThrone(c,"front",b.rise);
if(b.s==="fire"){if(b.k==="low"){const e=b.f>0?GW:0;bolt(c,tipX,tipY,tipX+b.f*30,304,5);bolt(c,tipX+b.f*30,304,e,304,5)}else b.xs.forEach(x=>{c.fillStyle="rgba(184,255,26,.25)";c.fillRect(x-14,0,28,320);bolt(c,x,0,x,320,6)})}
if(b.s==="melee"&&b.t>=b.mt&&b.t<b.mt+8){const zx=b.f>0?b.x+4:b.x-88;c.fillStyle="rgba(184,255,26,.3)";c.fillRect(zx,b.fy-96,84,96);for(let i=0;i<3;i++)bolt(c,tipX,tipY,zx+Math.random()*84,b.fy-Math.random()*90,3)}
for(const o of p.orbs){c.fillStyle="rgba(127,233,255,.25)";c.beginPath();c.arc(o.x,o.y,o.r+7+Math.sin(T/50)*2,0,7);c.fill();for(let i=1;i<4;i++){c.fillStyle="rgba(127,233,255,"+(.3-i*.07)+")";c.beginPath();c.arc(o.x-o.vx*i*3,o.y,o.r-i*1.5,0,7);c.fill()}c.fillStyle="#7fe9ff";c.beginPath();c.arc(o.x,o.y,o.r,0,7);c.fill();c.fillStyle="#fff";c.beginPath();c.arc(o.x,o.y,o.r*.45,0,7);c.fill()}
for(const w of p.waves){c.fillStyle="rgba(184,255,26,.35)";c.fillRect(w.x-10,294,20,26);bolt(c,w.x,320,w.x-w.d*6,292,3);bolt(c,w.x+w.d*4,320,w.x,296,2)}
if(b.s==="throne"&&p.x>220||b.s==="rise"){const t=b.s==="rise"?"Os elétrons são MEUS!":"Então você chegou até aqui…";c.font="bold 13px Arial";const w=c.measureText(t).width+16;c.fillStyle="#f1ecf8";c.fillRect(b.x-w/2,96,w,26);c.fillRect(b.x-4,122,8,8);c.fillStyle="#050308";c.fillText(t,b.x-w/2+8,114)}
drawPlayer(c,p.x,p.y,p.f,p.atk,p.inv>0&&(p.inv>>2)%2);
for(const f of p.fx){c.fillStyle="#b8ff1a";c.font="bold 14px Arial";c.fillText(f.tx||"+1",f.x,f.y)}
c.restore();
c.fillStyle="#b8ff1a";c.font="bold 14px Arial";c.fillText("Vida",12,22);heartsDraw(c,p.hp);
if(b.rise>=1){c.fillStyle="#b8ff1a";c.font="bold 14px Arial";c.fillText("Dr. Eletrônio",GW-232,24);c.strokeStyle="#4b2a7a";c.lineWidth=2;c.strokeRect(GW-232,30,220,14);c.fillStyle="#ff5470";c.fillRect(GW-230,32,216*Math.max(0,b.hp)/BHP,10);c.fillStyle="#050308";c.fillRect(GW-230+216/3-1,32,2,10);c.fillRect(GW-230+216*2/3-1,32,2,10)}}
buildBG();buildHall();
function pick(j){st.sel=st.op[st.p[st.i]][j];document.querySelectorAll(".opt").forEach((b,k)=>b.classList.toggle("on",k===j));$("go").disabled=false}
function next(){st.a[st.p[st.i]]=st.sel;st.i++;ls("st_"+st.c,{n:st.n,c:st.c,i:st.i,a:st.a,p:st.p,op:st.op,intro:1});$("ov").style.display="none";q()}
function mk(s){const p=s.n+"|"+s.a.join("");return btoa(unescape(encodeURIComponent(p+"|"+hash(p))))}
async function send(d){app.innerHTML='<div class="card"><p>Enviando sua prova…</p></div>';
try{d.sent=!!await rpc("enviar",{p_codigo:d.c,p_respostas:d.a.join("")});d.err=d.sent?"":"O servidor recusou o envio (prova já enviada ou código não cadastrado)."}catch(e){d.err="Sem conexão com o servidor."}
ls("done_"+d.c,d);finish(d)}
function retry(c){send(ls("done_"+c))}
function finish(d){
const hit=d.a.map((v,i)=>v===Q[i].a),n=hit.filter(Boolean).length;
app.innerHTML=`<h1>Você escapou da mansão</h1><div class="card"><p>${esc(d.n)}, prova finalizada. Você acertou <b class="ok">${n}</b> de ${Q.length} portas. A nota oficial será divulgada pelo professor.</p>
${d.sent?'<p class="ok"><b>Prova enviada ao professor.</b></p>':`<p class="err"><b>Prova ainda não enviada.</b> ${esc(d.err||"")}</p><button onclick="retry('${d.c}')">Tentar enviar de novo</button><p>Se não conseguir, mostre este código ao professor:</p><div class="code">${d.code}</div>`}</div>
<div class="card"><h2>Revisão</h2>${Q.map((x,i)=>`<p><b class="${hit[i]?"ok":"err"}">${hit[i]?"Certa":"Errada"}</b> <b>Questão ${i+1}:</b> ${esc(x.t)}<br><span style="color:var(--mut)">Resposta certa: ${"ABCD"[(d.op?d.op[i]:[0,1,2,3]).indexOf(x.a)]}) ${esc(x.o[x.a])}</span></p>`).join("")}</div>
<button class="sec" onclick="home()">Sair</button>`}

/* PROFESSOR */
let PIN="",DATA=[],W=[];
const fmt=n=>String(n).replace(".",",");
function dist(t){const u=t*2,b=Math.floor(u/Q.length),r=u%Q.length;return Q.map((_,i)=>(b+(i<r?1:0))/2)}
function tLogin(msg=""){app.innerHTML=`<h1>Área do professor</h1><div class="card"><input id="pin" type="password" placeholder="PIN do professor"><div class="err">${msg}</div><button onclick="tCheck()">Entrar</button><button class="sec" onclick="home()">Voltar</button></div>`}
async function load(){const w=await rpc("prof_pesos",{p_pin:PIN});if(w.length!==Q.length)throw new Error("tabela de pesos vazia: rode o script SQL");W=w.map(x=>Number(x.peso));DATA=await rpc("prof_resultados",{p_pin:PIN})||[]}
async function tCheck(){const p=$("pin").value;try{if(!await rpc("pin_ok",{p}))return tLogin("PIN incorreto.");PIN=p;await load();panel()}catch(e){tLogin("Não foi possível conectar ao banco: "+esc(e.message))}}
async function refresh(){try{await load();panel()}catch(e){panel("Erro: "+e.message)}}
function panel(msg=""){
const T=W.reduce((a,b)=>a+b,0),loc=ls("res")||{},sc=a=>a.reduce((s,v,i)=>s+(v===Q[i].a?W[i]:0),0),ok=a=>a.filter((v,i)=>v===Q[i].a).length;
const names=new Set(DATA.map(r=>norm(r.nome)));
const rows=DATA.map(r=>{const a=r.respostas?r.respostas.split("").map(Number):null;return `<tr><td>${esc(r.nome)}</td><td class="code" style="font-size:.9rem">${esc(r.codigo)}</td><td>${a?"Enviou":"Pendente"}</td><td>${a?ok(a)+"/"+Q.length:"-"}</td><td><b>${a?fmt(sc(a)):"-"}</b></td><td>${a?`<button class="sec" style="margin:0 6px 0 0;padding:6px 10px" onclick="liberar('${esc(r.codigo)}')">Liberar</button>`:""}<button class="sec" style="margin:0 6px 0 0;padding:6px 10px" onclick="excluir('${esc(r.codigo)}')">Excluir</button></td></tr>`}).join("")
+Object.entries(loc).filter(([k])=>!names.has(k)).map(([k,r])=>`<tr><td>${esc(r.n)}</td><td>-</td><td>Importado</td><td>${ok(r.a)}/${Q.length}</td><td><b>${fmt(sc(r.a))}</b></td><td>-</td></tr>`).join("");
app.innerHTML=`<h1>Painel do professor</h1><button class="sec" onclick="home()">Sair</button><button class="sec" onclick="refresh()">Atualizar dados</button><div class="err">${esc(msg)}</div>
<div class="card"><h2>PIN do professor</h2><input id="np" placeholder="Novo PIN (mínimo 4 caracteres)"><button onclick="setPin()">Alterar PIN</button></div>
<div class="card"><h2>1. Contas dos alunos</h2><p style="color:var(--mut)">Um nome por linha. O código de cada aluno é gerado e salvo no banco.</p>
<textarea id="lst">${esc(DATA.map(r=>r.nome).join("\n"))}</textarea><button onclick="saveAl()">Gerar códigos e salvar</button></div>
<div class="card"><h2>2. Valor da prova e de cada questão</h2><p>Valor total da prova: <select id="tot" style="width:auto" onchange="setTot(this.value)">${Array.from({length:11},(_,i)=>5+i/2).map(v=>`<option value="${v}"${v===T?" selected":""}>${fmt(v)}</option>`).join("")}</select> <span style="color:var(--mut)">(de 5 a 10, passos de 0,5; ao mudar, os pesos são redistribuídos)</span></p>
<p>Soma das questões: <b class="${T>=5&&T<=10?"ok":"err"}">${fmt(T)}</b> ${T>=5&&T<=10?"":"(fora de 5 a 10: ajuste)"}</p>
<div class="wrap"><table><tr>${W.map((v,i)=>`<td>Q${i+1}<input class="w" type="number" min="0" max="10" step="0.5" value="${v}" onchange="setW(${i},this.value)"></td>`).join("")}</tr></table></div></div>
<div class="card"><h2>3. Alunos e resultados</h2><div class="wrap"><table><tr><th>Aluno</th><th>Código</th><th>Situação</th><th>Acertos</th><th>Nota</th><th>Ações</th></tr>${rows}</table></div>
<p style="color:var(--mut)">Reserva: se um aluno não conseguiu enviar, cole o código de entrega dele aqui, um por linha.</p><textarea id="imp"></textarea><button onclick="imp()">Importar</button></div>`}
async function liberar(c){if(!confirm("Apagar a prova enviada deste aluno e permitir que ele refaça?"))return;try{await rpc("prof_liberar",{p_pin:PIN,p_codigo:c});await load();panel("Prova liberada. O aluno já pode entrar de novo.")}catch(e){panel("Erro: "+e.message)}}
async function excluir(c){if(!confirm("Excluir este aluno e a prova dele? Não dá para desfazer."))return;try{await rpc("prof_excluir_aluno",{p_pin:PIN,p_codigo:c});await load();panel("Aluno excluído.")}catch(e){panel("Erro: "+e.message)}}
async function saveAl(){const l=$("lst").value.split("\n").map(s=>s.trim()).filter(Boolean);try{await Promise.all(l.map(n=>rpc("prof_salvar_aluno",{p_pin:PIN,p_codigo:hash(norm(n)),p_nome:n})));await load();panel("Alunos salvos.")}catch(e){panel("Erro: "+e.message)}}
async function setW(i,v){v=Math.round(parseFloat(v||0)*2)/2;try{await rpc("prof_salvar_peso",{p_pin:PIN,p_questao:i+1,p_peso:v});W[i]=v;panel()}catch(e){panel("Erro: "+e.message)}}
async function setTot(v){const d=dist(parseFloat(v));try{await Promise.all(d.map((p,i)=>rpc("prof_salvar_peso",{p_pin:PIN,p_questao:i+1,p_peso:p})));W=d;panel()}catch(e){panel("Erro: "+e.message)}}
async function setPin(){const p=$("np").value.trim();if(p.length<4)return alert("Use pelo menos 4 caracteres.");try{await rpc("prof_trocar_pin",{p_pin:PIN,p_novo:p});PIN=p;alert("PIN alterado.")}catch(e){alert("Não foi possível trocar o PIN. Rode o SQL extra no Supabase.")}}
function imp(){const res=ls("res")||{};let bad=0;
$("imp").value.split("\n").map(s=>s.trim()).filter(Boolean).forEach(l=>{try{const p=decodeURIComponent(escape(atob(l))).split("|"),ck=p.pop(),b=p.join("|");if(hash(b)!==ck)throw 0;const k=b.lastIndexOf("|"),a=b.slice(k+1).split("").map(Number);res[norm(b.slice(0,k))]={n:b.slice(0,k),a}}catch(e){bad++}});
ls("res",res);panel(bad?bad+" código(s) inválido(s).":"")}
home();
</script>
