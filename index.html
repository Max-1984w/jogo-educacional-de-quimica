<script>

{s:"Na noite de Halloween, você entra na mansão abandonada do Dr. Eletrônio Von Atrakt, um cientista louco que roubou os elétrons da cidade para ressuscitar seus monstros. A porta se tranca atrás de você! Para fugir, é preciso abrir 10 portas assombradas, cada uma com uma pergunta de química. Cuidado: a mansão não avisa se você errou…",

{s:"A porta range e revela uma cripta de frascos borbulhantes e luz verde. Uma risada ecoa: “Só passa quem conhece o rei dos elétrons!”",

{s:"Na parede, um líquido verde-ácido desenha setas sobre uma tabela periódica rasgada, mas elas estão embaralhadas.",
 t:"Como varia a eletronegatividade na tabela periódica (sem considerar gases nobres)?",o:["Aumenta da esquerda para a direita e de baixo para cima","Aumenta da direita para a esquerda e de cima para baixo","Aumenta de cima para baixo e da esquerda para a direita","É igual para todos os elementos"],a:0},
{s:"Quatro caldeirões fumegantes precisam ser alinhados na mesa do ritual: do que menos atrai elétrons ao que mais atrai.",

{s:"No corredor sombrio, um frasco de ácido clorídrico vaza e uma névoa roxa sobe. Uma voz grita: “Quem fica com o elétron na molécula de HCl?”",
 t:"Na molécula de HCl, o cloro é mais eletronegativo que o hidrogênio. O que ocorre?",o:["O cloro fica com carga parcial negativa e o hidrogênio com parcial positiva","O hidrogênio fica com carga parcial negativa","Os dois ficam neutros, sem nenhuma polaridade","O hidrogênio transfere os prótons para o cloro"],a:0},
{s:"Você chega ao porão do gerador, cheio de teias. Dois átomos idênticos de cloro formam o cadeado da porta.",

{s:"Sobre a bancada, entre morcegos adormecidos, o cientista deixou NaCl e HCl. Só uma delas tem uma diferença de eletronegatividade enorme.",
 t:"Uma diferença de eletronegatividade muito grande entre os átomos (como Na e Cl) tende a formar ligação:",o:["Covalente apolar","Covalente polar fraca","Iônica","Nenhuma, pois não haverá ligação"],a:2},
{s:"Atrás de um vidro rachado, hélio e neônio brilham como fantasmas nos tubos. O Dr. Eletrônio provoca: “Esses espectros não valem nada na minha tabela!”",
 t:"Por que os gases nobres geralmente não têm valores de eletronegatividade atribuídos?",o:["Porque são radioativos","Porque praticamente não formam ligações químicas","Porque não têm elétrons","Porque são muito pesados"],a:1},
{s:"A mansão começa a inundar de uma água escura e a única saída é pela válvula da molécula de água.",
 t:"Na molécula de H₂O, qual átomo atrai mais fortemente os elétrons compartilhados?",o:["Os dois hidrogênios, por serem dois","O oxigênio, por ser mais eletronegativo","Nenhum, a atração é igual","O hidrogênio, por ser menor"],a:1},
{s:"A última porta! O Dr. Eletrônio surge das sombras, furioso: “Ordene os quatro e eu devolvo os elétrons da cidade… ou fique aqui para sempre!”",
 t:"Qual é a ordem decrescente de eletronegatividade entre C, N, O e F?",o:["C, N, O, F","O, F, N, C","F, O, N, C","N, F, C, O"],a:2}
];
const K="drE_",mem={};
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(K+k));localStorage.setItem(K+k,JSON.stringify(v))}catch(e){if(v===undefined)return mem[k]??null;mem[k]=v}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=n=>n.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ");
function hash(s){let h=5381;for(const c of s+"ELETRO26")h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36).toUpperCase().padStart(5,"0").slice(-5)}
const $=id=>document.getElementById(id),app=$("app");
let st=null;

function home(msg=""){
app.innerHTML=`<h1>A Mansão do Dr. Eletrônio</h1><p style="color:var(--mut)">Prova bimestral de Química: eletronegatividade, 1º ano</p>
<div class="card"><h2>Entrar na prova</h2><input id="nm" placeholder="Seu nome completo" autocomplete="off"><input id="cd" placeholder="Seu código (5 caracteres)" autocomplete="off" style="text-transform:uppercase">
<div class="err">${msg}</div><button onclick="login()">Começar</button></div>
<p><button class="sec" onclick="tLogin()">Área do professor</button></p>`}

const SB="https://jzalzkcbsmvqjrycjdrx.supabase.co",KEY="sb_publishable_bmOzl_lwm0tAWEMf3barnQ_C-jEVBVB";
async function rpc(fn,a){const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(a||{})});const t=await r.text();if(!r.ok)throw new Error(t||r.status);return t?JSON.parse(t):null}
async function login(){
const n=$("nm").value,c=$("cd").value.trim().toUpperCase();
if(!n.trim()||hash(norm(n))!==c)return home("Nome ou código inválido. Confira com seu professor.");
const done=ls("done_"+c);if(done){try{if(done.sent&&!await rpc("ja_enviou",{p_codigo:c})){ls("done_"+c,null);ls("st_"+c,null)}else return finish(done)}catch(e){return finish(done)}}
try{if(!await rpc("existe",{p_codigo:c}))return home("Este código não está cadastrado. Fale com o professor.");
if(await rpc("ja_enviou",{p_codigo:c}))return home("A prova deste aluno já foi enviada.")}catch(e){}
st=ls("st_"+c)||{n:n.trim(),c,i:0,a:Q.map(()=>null),p:perm(c)};if(!st.p)st.p=Q.map((_,i)=>i);q()}
function perm(c){let h=0;for(const ch of c+"PROVA")h=(h*31+ch.charCodeAt(0))>>>0;
const r=()=>{h=(h+0x6D2B79F5)>>>0;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
const m=Q.map((_,i)=>i).slice(1,-1);for(let i=m.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[m[i],m[j]]=[m[j],m[i]]}
return [0,...m,Q.length-1]}
/* JOGO DE PLATAFORMA */
const SEC=640,GW=800,GH=400;
let G=null,raf=0,last=0,acc=0;
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const nk=e=>e.key.length===1?e.key.toLowerCase():e.key;
function kd(e){if(!G)return;const k=nk(e);if(!G.paused&&["ArrowLeft","ArrowRight","ArrowUp"," "].includes(k))e.preventDefault();G.k[k]=1}
function ku(e){if(G)G.k[nk(e)]=0}
function stopGame(){cancelAnimationFrame(raf);G=null;removeEventListener("keydown",kd);removeEventListener("keyup",ku)}
function q(){if(st.i>=Q.length){stopGame();const d={n:st.n,c:st.c,a:st.a,code:mk(st),sent:false};ls("done_"+st.c,d);return send(d)}startGame()}
function hud(){$("pn").textContent=Math.min(st.i+1,Q.length);$("sg").innerHTML=Q.map((_,k)=>`<i class="${k<st.i?"d":k===st.i?"c":""}"></i>`).join("")}
function ovShow(h){const o=$("ov");o.style.display="block";o.innerHTML=`<div class="card" style="max-width:720px;margin:0 auto">${h}</div>`}
function startGame(){
stopGame();
app.innerHTML=`<h1>Porta <span id="pn"></span> de ${Q.length}</h1><div class="seg" id="sg"></div>
<canvas id="cv" width="${GW}" height="${GH}" style="width:100%;display:block;margin-top:12px;border:2px solid var(--ln);box-shadow:6px 6px 0 var(--ac2);background:#000;image-rendering:pixelated"></canvas>
<div class="pad"><button class="sec" id="tl">Esquerda</button><button class="sec" id="tr">Direita</button><button id="tj">Pular</button></div>
<p style="color:var(--mut);font-size:.9rem">Setas ou A e D para andar. Espaço ou seta para cima para pular. Pule em cima dos fantasmas para derrotá-los. Chegue à porta para responder.</p>
<div id="ov" style="display:none;position:fixed;inset:0;z-index:50;overflow:auto;background:rgba(5,3,8,.96);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 32px"></div>`;
const so=[],en=[],co=[];
for(let k=0;k<Q.length;k++){const o=k*SEC,pit=k%2===1;
 if(pit)so.push({x:o,y:320,w:260,h:80},{x:o+350,y:320,w:SEC-350,h:80});else so.push({x:o,y:320,w:SEC,h:80});
 if(k%3===2){so.push({x:o+380,y:250,w:80,h:14});co.push({x:o+414,y:226})}
 if(pit)[275,305,335].forEach((d,j)=>co.push({x:o+d,y:j===1?215:230}));else[420,450,480].forEach(d=>co.push({x:o+d,y:292}));
 if(k>0&&k%2===0)en.push({x:o+120,a:o+120,b:o+300,y:288,d:1,alive:true})}
so.push({x:Q.length*SEC,y:320,w:300,h:80});
G={x:st.i*SEC+40,y:288,w:22,h:32,vx:0,vy:0,g:false,f:1,k:{},n:0,hurt:0,paused:false,so,en,co};
hud();
const tb={tl:"ArrowLeft",tr:"ArrowRight",tj:" "};
for(const id in tb){const b=$(id);b.onpointerdown=e=>{e.preventDefault();if(G)G.k[tb[id]]=1};["onpointerup","onpointerleave","onpointercancel"].forEach(h=>b[h]=()=>{if(G)G.k[tb[id]]=0})}
addEventListener("keydown",kd);addEventListener("keyup",ku);
if(st.i===0&&!st.intro){G.paused=true;ovShow(`<p class="story">${esc(Q[0].s)}</p><h2>Como jogar</h2><p>Use as setas (ou A e D) para andar e Espaço (ou seta para cima) para pular. Pule em cima dos fantasmas para derrotá-los e cuidado com os buracos. Chegue até cada porta para responder uma pergunta.</p><p>Cair ou esbarrar em um fantasma só faz você voltar ao começo da fase. A nota depende apenas das suas respostas, e a mansão não avisa quais estão certas.</p><button onclick="begin()">Começar</button>`)}
last=0;acc=0;raf=requestAnimationFrame(loop)}
function begin(){st.intro=1;$("ov").style.display="none";G.paused=false}
function ask(){G.paused=true;G.k={};const x=Q[st.p[st.i]];st.sel=null;
ovShow(`<p style="color:var(--mut);margin:0 0 8px">Porta ${st.i+1} de ${Q.length}</p>${st.p[st.i]===0?"":`<p class="story">${esc(x.s)}</p>`}<h2>${esc(x.t)}</h2>${x.o.map((o,j)=>`<button class="opt" onclick="pick(${j})"><b class="ltr">${"ABCD"[j]}</b><span>${esc(o)}</span></button>`).join("")}<button id="go" disabled onclick="next()">Confirmar e abrir a porta</button>`)}
function die(){G.x=st.i*SEC+40;G.y=288;G.vx=G.vy=0;G.hurt=40}
function step(){
const p=G,k=p.k,ax=(k.ArrowRight||k.d?1:0)-(k.ArrowLeft||k.a?1:0);
p.vx=ax*3.6;if(ax)p.f=ax;
if((k[" "]||k.ArrowUp||k.w)&&p.g){p.vy=-12.5;p.g=false}
p.vy=Math.min(p.vy+.6,14);
p.x=Math.max(0,p.x+p.vx);
if(p.vx)for(const s of p.so)if(hit(p,s))p.x=p.vx>0?s.x-p.w:s.x+s.w;
p.y+=p.vy;p.g=false;
for(const s of p.so)if(hit(p,s)){if(p.vy>0){p.y=s.y-p.h;p.g=true}else p.y=s.y+s.h;p.vy=0}
if(p.y>GH+60)return die();
if(p.hurt>0)p.hurt--;
for(const c of p.co)if(!c.t&&hit(p,{x:c.x,y:c.y,w:12,h:12})){c.t=1;p.n++}
for(const e of p.en){if(!e.alive)continue;e.x+=e.d;if(e.x<e.a||e.x>e.b)e.d*=-1;
 if(!p.hurt&&hit(p,{x:e.x,y:e.y,w:28,h:32})){if(p.vy>0&&p.y+p.h-p.vy<=e.y+12){e.alive=false;p.vy=-8}else return die()}}
const d=st.i*SEC+560;if(st.i<Q.length&&p.x+p.w>=d&&p.x<=d+40)ask()}
function loop(t){if(!G)return;acc+=Math.min(t-last,100);last=t;while(acc>=16.67){if(!G.paused)step();acc-=16.67}draw();raf=requestAnimationFrame(loop)}
function draw(){
const c=$("cv").getContext("2d"),p=G,cam=Math.max(0,Math.min(p.x-320,Q.length*SEC+300-GW));
c.fillStyle="#050308";c.fillRect(0,0,GW,GH);
c.fillStyle="#8a2be2";c.fillRect(650,36,56,56);c.fillStyle="#4b2a7a";c.fillRect(664,50,20,20);
for(let i=0;i<8;i++){const x=((i*190-cam*.35)%1520+1520)%1520-120,h=110+(i*53%90);c.fillStyle="#0e0916";c.fillRect(x,320-h,150,h);c.fillStyle=i%3?"#1a0f2e":"rgba(184,255,26,.55)";c.fillRect(x+30,320-h+28,14,18);c.fillRect(x+90,320-h+28,14,18)}
for(const s of p.so){const x=s.x-cam;if(x>GW||x+s.w<0)continue;c.fillStyle="#1a0f2e";c.fillRect(x,s.y,s.w,s.h);c.fillStyle="#8a2be2";c.fillRect(x,s.y,s.w,6)}
for(let k=0;k<Q.length;k++){const x=k*SEC+560-cam;if(x<-60||x>GW)continue;const open=k<st.i;
 c.fillStyle="#4b2a7a";c.fillRect(x-4,252,48,68);c.fillStyle=open?"#000":"#8a2be2";c.fillRect(x,256,40,64);
 if(!open){c.fillStyle="#b8ff1a";c.fillRect(x+30,290,5,5);c.fillStyle="#f1ecf8";c.font="bold 16px Arial";c.fillText(k+1,x+(k>8?10:15),282)}}
for(const o of p.co){if(o.t)continue;const x=o.x-cam;c.fillStyle="#b8ff1a";c.fillRect(x,o.y,12,12);c.fillStyle="#050308";c.fillRect(x+4,o.y+4,4,4)}
for(const e of p.en){if(!e.alive)continue;const x=e.x-cam;c.fillStyle="#f1ecf8";c.fillRect(x,e.y,28,24);[0,1,2].forEach(i=>{if(i!==1)c.fillRect(x+i*10,e.y+24,8,8)});c.fillStyle="#050308";c.fillRect(x+6,e.y+6,5,6);c.fillRect(x+17,e.y+6,5,6)}
if(!(p.hurt>0&&(p.hurt>>2)%2)){const x=p.x-cam,y=p.y;c.fillStyle="#4b2a7a";c.fillRect(x+3,y+26,6,6);c.fillRect(x+13,y+26,6,6);c.fillStyle="#f1ecf8";c.fillRect(x+1,y+13,20,13);c.fillStyle="#b8ff1a";c.fillRect(x+1,y+12,20,3);c.fillStyle="#e8d5c4";c.fillRect(x+4,y+2,14,11);c.fillStyle="#8a2be2";c.fillRect(x+3,y,16,5);c.fillStyle="#050308";c.fillRect(x+(p.f>0?13:6),y+7,3,3)}
c.fillStyle="#b8ff1a";c.font="bold 14px Arial";c.fillText("Elétrons: "+p.n,12,24)}
function pick(j){st.sel=j;document.querySelectorAll(".opt").forEach((b,k)=>b.classList.toggle("on",k===j));$("go").disabled=false}
function next(){st.a[st.p[st.i]]=st.sel;st.i++;ls("st_"+st.c,{n:st.n,c:st.c,i:st.i,a:st.a,p:st.p,intro:1});$("ov").style.display="none";G.k={};hud();G.paused=false;if(st.i>=Q.length)q()}
function mk(s){const p=s.n+"|"+s.a.join("");return btoa(unescape(encodeURIComponent(p+"|"+hash(p))))}
async function send(d){app.innerHTML='<div class="card"><p>Enviando sua prova…</p></div>';
try{d.sent=!!await rpc("enviar",{p_codigo:d.c,p_respostas:d.a.join("")});d.err=d.sent?"":"O servidor recusou o envio (prova já enviada ou código não cadastrado)."}catch(e){d.err="Sem conexão com o servidor."}
ls("done_"+d.c,d);finish(d)}
function retry(c){send(ls("done_"+c))}
function finish(d){
const hit=d.a.map((v,i)=>v===Q[i].a),n=hit.filter(Boolean).length;
app.innerHTML=`<h1>Você escapou da mansão</h1><div class="card"><p>${esc(d.n)}, prova finalizada. Você acertou <b class="ok">${n}</b> de ${Q.length} portas. A nota oficial será divulgada pelo professor.</p>
${d.sent?'<p class="ok"><b>Prova enviada ao professor.</b></p>':`<p class="err"><b>Prova ainda não enviada.</b> ${esc(d.err||"")}</p><button onclick="retry('${d.c}')">Tentar enviar de novo</button><p>Se não conseguir, mostre este código ao professor:</p><div class="code">${d.code}</div>`}</div>
<div class="card"><h2>Revisão</h2>${Q.map((x,i)=>`<p><b class="${hit[i]?"ok":"err"}">${hit[i]?"Certa":"Errada"}</b> <b>Questão ${i+1}:</b> ${esc(x.t)}<br><span style="color:var(--mut)">Resposta certa: ${"ABCD"[x.a]}) ${esc(x.o[x.a])}</span></p>`).join("")}</div>
<button class="sec" onclick="home()">Sair</button>`}

/* PROFESSOR */
let PIN="",DATA=[],W=[];
const fmt=n=>String(n).replace(".",",");
function dist(t){const u=t*2,b=Math.floor(u/Q.length),r=u%Q.length;return Q.map((_,i)=>(b+(i<r?1:0))/2)}
function tLogin(msg=""){app.innerHTML=`<h1>Área do professor</h1><div class="card"><input id="pin" type="password" placeholder="PIN do professor"><div class="err">${msg}</div><button onclick="tCheck()">Entrar</button><button class="sec" onclick="home()">Voltar</button></div>`}
async function load(){const w=await rpc("prof_pesos",{p_pin:PIN});if(w.length!==Q.length)throw new Error("tabela de pesos vazia: rode o script SQL");W=w.map(x=>Number(x.peso));DATA=await rpc("prof_resultados",{p_pin:PIN})||[]}
async function tCheck(){const p=$("pin").value;try{if(!await rpc("pin_ok",{p}))return tLogin("PIN incorreto.");PIN=p;await load();panel()}catch(e){tLogin("Não foi possível conectar ao banco: "+esc(e.message))}}
async function refresh(){try{await load();panel()}catch(e){panel("Erro: "+e.message)}}
function panel(msg=""){
const T=W.reduce((a,b)=>a+b,0),loc=ls("res")||{},sc=a=>a.reduce((s,v,i)=>s+(v===Q[i].a?W[i]:0),0),ok=a=>a.filter((v,i)=>v===Q[i].a).length;
const names=new Set(DATA.map(r=>norm(r.nome)));
const rows=DATA.map(r=>{const a=r.respostas?r.respostas.split("").map(Number):null;return `<tr><td>${esc(r.nome)}</td><td class="code" style="font-size:.9rem">${esc(r.codigo)}</td><td>${a?"Enviou":"Pendente"}</td><td>${a?ok(a)+"/"+Q.length:"-"}</td><td><b>${a?fmt(sc(a)):"-"}</b></td><td>${a?`<button class="sec" style="margin:0 6px 0 0;padding:6px 10px" onclick="liberar('${esc(r.codigo)}')">Liberar</button>`:""}<button class="sec" style="margin:0 6px 0 0;padding:6px 10px" onclick="excluir('${esc(r.codigo)}')">Excluir</button></td></tr>`}).join("")
+Object.entries(loc).filter(([k])=>!names.has(k)).map(([k,r])=>`<tr><td>${esc(r.n)}</td><td>-</td><td>Importado</td><td>${ok(r.a)}/${Q.length}</td><td><b>${fmt(sc(r.a))}</b></td><td>-</td></tr>`).join("");
app.innerHTML=`<h1>Painel do professor</h1><button class="sec" onclick="home()">Sair</button><button class="sec" onclick="refresh()">Atualizar dados</button><div class="err">${esc(msg)}</div>
<div class="card"><h2>PIN do professor</h2><input id="np" placeholder="Novo PIN (mínimo 4 caracteres)"><button onclick="setPin()">Alterar PIN</button></div>
<div class="card"><h2>1. Contas dos alunos</h2><p style="color:var(--mut)">Um nome por linha. O código de cada aluno é gerado e salvo no banco.</p>
<textarea id="lst">${esc(DATA.map(r=>r.nome).join("\n"))}</textarea><button onclick="saveAl()">Gerar códigos e salvar</button></div>
<div class="card"><h2>2. Valor da prova e de cada questão</h2><p>Valor total da prova: <select id="tot" style="width:auto" onchange="setTot(this.value)">${Array.from({length:11},(_,i)=>5+i/2).map(v=>`<option value="${v}"${v===T?" selected":""}>${fmt(v)}</option>`).join("")}</select> <span style="color:var(--mut)">(de 5 a 10, passos de 0,5; ao mudar, os pesos são redistribuídos)</span></p>
<p>Soma das questões: <b class="${T>=5&&T<=10?"ok":"err"}">${fmt(T)}</b> ${T>=5&&T<=10?"":"(fora de 5 a 10: ajuste)"}</p>
<div class="wrap"><table><tr>${W.map((v,i)=>`<td>Q${i+1}<input class="w" type="number" min="0" max="10" step="0.5" value="${v}" onchange="setW(${i},this.value)"></td>`).join("")}</tr></table></div></div>
<div class="card"><h2>3. Alunos e resultados</h2><div class="wrap"><table><tr><th>Aluno</th><th>Código</th><th>Situação</th><th>Acertos</th><th>Nota</th><th>Ações</th></tr>${rows}</table></div>
<p style="color:var(--mut)">Reserva: se um aluno não conseguiu enviar, cole o código de entrega dele aqui, um por linha.</p><textarea id="imp"></textarea><button onclick="imp()">Importar</button></div>`}
async function liberar(c){if(!confirm("Apagar a prova enviada deste aluno e permitir que ele refaça?"))return;try{await rpc("prof_liberar",{p_pin:PIN,p_codigo:c});await load();panel("Prova liberada. O aluno já pode entrar de novo.")}catch(e){panel("Erro: "+e.message)}}
async function excluir(c){if(!confirm("Excluir este aluno e a prova dele? Não dá para desfazer."))return;try{await rpc("prof_excluir_aluno",{p_pin:PIN,p_codigo:c});await load();panel("Aluno excluído.")}catch(e){panel("Erro: "+e.message)}}
async function saveAl(){const l=$("lst").value.split("\n").map(s=>s.trim()).filter(Boolean);try{await Promise.all(l.map(n=>rpc("prof_salvar_aluno",{p_pin:PIN,p_codigo:hash(norm(n)),p_nome:n})));await load();panel("Alunos salvos.")}catch(e){panel("Erro: "+e.message)}}
async function setW(i,v){v=Math.round(parseFloat(v||0)*2)/2;try{await rpc("prof_salvar_peso",{p_pin:PIN,p_questao:i+1,p_peso:v});W[i]=v;panel()}catch(e){panel("Erro: "+e.message)}}
async function setTot(v){const d=dist(parseFloat(v));try{await Promise.all(d.map((p,i)=>rpc("prof_salvar_peso",{p_pin:PIN,p_questao:i+1,p_peso:p})));W=d;panel()}catch(e){panel("Erro: "+e.message)}}
async function setPin(){const p=$("np").value.trim();if(p.length<4)return alert("Use pelo menos 4 caracteres.");try{await rpc("prof_trocar_pin",{p_pin:PIN,p_novo:p});PIN=p;alert("PIN alterado.")}catch(e){alert("Não foi possível trocar o PIN. Rode o SQL extra no Supabase.")}}
function imp(){const res=ls("res")||{};let bad=0;
$("imp").value.split("\n").map(s=>s.trim()).filter(Boolean).forEach(l=>{try{const p=decodeURIComponent(escape(atob(l))).split("|"),ck=p.pop(),b=p.join("|");if(hash(b)!==ck)throw 0;const k=b.lastIndexOf("|"),a=b.slice(k+1).split("").map(Number);res[norm(b.slice(0,k))]={n:b.slice(0,k),a}}catch(e){bad++}});
ls("res",res);panel(bad?bad+" código(s) inválido(s).":"")}
home();
</script>
</body>
</html>
