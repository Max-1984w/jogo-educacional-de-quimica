<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O Último Experimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--p1:#240B36;--p0:#170A24;--p2:#542078;--r1:#A30D2D;--r0:#650B20;--w:#E8E0E8;--k:#09070D;--mut:#a597ae;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--k);color:var(--w);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3{font-family:Metamorphous,Georgia,serif;font-weight:400;margin:0 0 .5rem;letter-spacing:.02em}
#app{min-height:100%;background:radial-gradient(ellipse at 50% 0,var(--p1),var(--k) 70%)}
.card{max-width:420px;margin:0 auto;padding:12vh 20px 40px}
.card h1{font-size:2.4rem;line-height:1.1;color:var(--w);text-shadow:0 0 24px var(--r1)}
.sub{color:var(--mut);margin:0 0 1.5rem}
label{display:block;margin:.8rem 0;color:var(--mut);font-size:.9rem}
input,select,textarea{width:100%;margin-top:.25rem;padding:.65rem .75rem;background:var(--p0);border:1px solid var(--p2);color:var(--w);border-radius:4px;font:inherit}
textarea{min-height:140px;font-family:ui-monospace,monospace;font-size:.8rem}
:focus-visible{outline:2px solid var(--w);outline-offset:2px}
.btn,.sm{background:var(--r1);color:var(--w);border:1px solid var(--r0);padding:.7rem 1.1rem;border-radius:4px;font:inherit;font-weight:600;cursor:pointer}
.btn{width:100%;margin-top:.8rem}.btn:hover,.sm:hover{background:#c2123a}.btn:disabled,.sm:disabled{opacity:.45;cursor:not-allowed}
.sm{padding:.3rem .7rem;font-size:.85rem}.sm.alt{background:var(--p2);border-color:var(--p2)}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;margin-top:1rem;font:inherit}
.tabs{display:flex;gap:4px;margin-bottom:1rem;flex-wrap:wrap}.tabs button{flex:1;padding:.6rem;background:var(--p0);border:1px solid var(--p2);color:var(--mut);cursor:pointer;font:inherit;border-radius:4px}
.tabs button.on{background:var(--p2);color:var(--w)}
.wrap{max-width:1000px;margin:0 auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:1rem}
.box{background:var(--p0);border:1px solid var(--p2);border-radius:6px;padding:14px 16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.num{font:2rem Metamorphous,serif}.mut{color:var(--mut);font-size:.9rem}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0}.bar i{display:block;height:14px;background:var(--r1);min-width:2px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:7px 9px;border-bottom:1px solid var(--p1);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:130px}.row .sm{flex:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,40px);background:var(--r0);border:1px solid var(--r1);padding:10px 16px;border-radius:6px;opacity:0;transition:.25s;z-index:99;max-width:90vw}#toast.on{opacity:1;transform:translate(-50%,0)}
/* jogo */
#stage{position:relative;width:100%;height:100vh;height:100dvh;background:var(--k);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none}
#cv{width:100%;max-height:100%;aspect-ratio:5/3;image-rendering:pixelated;background:var(--k)}
#hud{position:absolute;top:10px;right:12px;display:flex;gap:4px;font-size:1.7rem;line-height:1}
.h{color:var(--r1);text-shadow:0 0 10px var(--r1);transition:.3s}.h.off{color:#2a1a30;text-shadow:none}.h.pulse{animation:pl .6s}
@keyframes pl{30%{transform:scale(1.6) rotate(-12deg)}}
#room{position:absolute;top:12px;left:14px;color:var(--mut);font-size:.9rem;max-width:45%}
#cap{position:absolute;bottom:14%;left:50%;transform:translateX(-50%);width:min(560px,90%);text-align:center;font-style:italic;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .8s;pointer-events:none}
#cap.on{opacity:1}
#prompt{position:absolute;left:50%;top:28%;transform:translateX(-50%);background:#09070dcc;border:1px solid var(--r1);padding:4px 12px;border-radius:4px;display:none}
#menub{position:absolute;top:44px;left:12px;background:#09070d99;border:1px solid var(--p2);color:var(--w);border-radius:4px;padding:4px 10px;cursor:pointer}
#joy{position:absolute;left:24px;bottom:24px;width:120px;height:120px;border-radius:50%;border:2px solid var(--p2);background:#09070d66;display:none}
#joy i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:var(--p2)}
#ebtn{position:absolute;right:24px;bottom:36px;width:76px;height:76px;border-radius:50%;border:2px solid var(--r1);background:#650B2099;color:var(--w);font:700 1.5rem Metamorphous;display:none}
.touch #joy,.touch #ebtn{display:block}
.ov{position:absolute;inset:0;background:#09070de6;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto;z-index:5}
.qbox{max-width:640px;width:100%;background:var(--p0);border:1px solid var(--r1);border-radius:8px;padding:18px;box-shadow:0 0 40px #a30d2d55}
.qbox .enun{font-size:1.1rem;margin:.4rem 0 1rem}.qbox img{max-width:100%;max-height:200px;display:block;margin:0 auto 1rem;border-radius:4px}
.alts button{display:block;width:100%;text-align:left;margin:6px 0;padding:.7rem .8rem;background:var(--p1);border:1px solid var(--p2);color:var(--w);border-radius:4px;font:inherit;cursor:pointer}
.alts button.sel{border-color:var(--w);background:var(--p2)}.alts b{display:inline-block;width:1.6em;color:var(--mut)}
.fin{text-align:center;max-width:520px}.fin .nota{font:4.5rem Metamorphous,serif;color:var(--w);text-shadow:0 0 30px var(--r1);margin:.5rem 0}
.susto{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 45%,#A30D2D 0,#650B20 55%,#1a0006 100%);box-shadow:inset 0 0 220px #000;animation:flick .18s steps(2) infinite alternate}
.susto>div{max-width:520px;animation:tremor .35s linear infinite}.susto h1{font-size:clamp(2rem,9vw,3.4rem);line-height:1.05;color:#fff;text-shadow:3px 0 #09070d,-3px 0 #240B36,0 0 30px #000}
.susto p{font-size:1.25rem;color:#fff}.susto .ex{font-family:ui-monospace,monospace;background:#09070d99;padding:8px;border-radius:4px;font-size:1rem}.susto .btn{background:#09070d;border-color:#fff}
@keyframes flick{to{filter:brightness(.78)}}@keyframes tremor{25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
"use strict";
/* =====================================================================
   CONFIGURAÇÃO DO SERVIDOR: cole abaixo a URL e a chave ANON (pública) do Supabase.
   Supabase > Project Settings > API. NUNCA use a chave service_role aqui.
   ===================================================================== */
const PRESET={url:"COLE_AQUI_A_URL_DO_SUPABASE",key:"COLE_AQUI_A_CHAVE_ANON"};
const PRESET_OK=!/COLE_AQUI/.test(PRESET.url+PRESET.key)&&/^https?:\/\//.test(PRESET.url);
/* ===== util ===== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
let sb,me=null;
const H=(()=>{try{return JSON.parse(atob((location.hash.match(/^#c=(.+)$/)||[])[1]||""))}catch{return{}}})();
let cfg=PRESET_OK?{url:PRESET.url,key:PRESET.key}:{url:H.u||ls.get("ue_url")||"",key:H.k||ls.get("ue_key")||""};
const semAcento=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const problema=s=>/[\u0300-\u036f]/.test(s.normalize("NFD"))?"acento":/[^A-Za-z ]/.test(s)?"simbolo":null;
const MSG={nao_autorizado:"Você não está autorizado nesta avaliação.",ainda_nao_aberta:"A avaliação ainda não abriu.",periodo_encerrado:"O período da avaliação terminou.",avaliacao_indisponivel:"Avaliação indisponível.",ja_concluida:"Você já realizou esta avaliação.",aluno_inativo:"Cadastro inativo. Fale com o professor.",aluno_nao_encontrado:"Esta conta não tem cadastro de aluno. Fale com o professor.",acesso_negado:"Acesso negado.","Invalid login credentials":"Usuário ou senha incorretos.","Failed to fetch":"Sem conexão. Seu progresso confirmado está salvo; tente de novo."};
const errMsg=e=>{const m=(e&&e.message)||String(e);return MSG[m]||m};
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),5000)}
const rpc=async(n,a)=>{const{data,error}=await sb.rpc(n,a);if(error)throw error;return data};
const view=h=>{stopGame();$("#app").innerHTML=h};
const fmtD=s=>s?new Date(s).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"—";
const dur=s=>s==null?"—":Math.floor(s/60)+"min "+String(s%60).padStart(2,"0")+"s";
const STAT={em_andamento:"Em andamento",concluida:"Concluída",encerrada_sem_vidas:"Sem vidas",expirada:"Expirada"};

/* ===== boot / entrada ===== */
async function boot(){
  if(!window.supabase)return view('<main class="card"><h1>Sem conexão</h1><p class="sub">Não foi possível carregar a biblioteca do Supabase. Verifique a internet e recarregue.</p></main>');
  if(!cfg.url||!cfg.key){view('<main class="card"><h1>Página não configurada</h1><p class="sub">Peça ao professor o link completo desta página.</p><button class="link" id="pc">Sou o professor</button></main>');$("#pc").onclick=viewConfig;return}
  sb=supabase.createClient(cfg.url,cfg.key);
  const{data:{session}}=await sb.auth.getSession();
  session?route():viewEntrada();
}
function viewConfig(){
  view(`<main class="card"><h1>Conectar ao servidor</h1><p class="sub">Cole a URL e a chave anon (pública) do seu projeto Supabase. Nunca use a service role aqui.</p>
  <label>URL do projeto<input id="cu" value="${esc(cfg.url)}" placeholder="https://xxxx.supabase.co"></label>
  <label>Chave anon<input id="ck" value="${esc(cfg.key)}"></label>
  <button class="btn" id="sv">Salvar e continuar</button></main>`);
  $("#sv").onclick=()=>{cfg={url:$("#cu").value.trim(),key:$("#ck").value.trim()};
    if(!/^https?:\/\//.test(cfg.url)||!cfg.key)return toast("Informe a URL (https://…) e a chave anon.");
    ls.set("ue_url",cfg.url);ls.set("ue_key",cfg.key);boot()};
}
function susto(tipo){
  const a=$("#alerta");if(!a||a.firstChild)return;navigator.vibrate&&navigator.vibrate([200,100,200]);
  a.innerHTML=`<div class="susto" role="alertdialog" aria-live="assertive"><div><h1>NOME NÃO RECONHECIDO</h1><p>${tipo=="acento"?"Seu nome tem <b>ACENTOS</b>.<br>Tire os acentos para continuar.":"Use somente <b>LETRAS</b> e espaços."}</p><p class="ex">JOÃO → JOAO<br>MARIA JOSÉ → MARIA JOSE</p><button class="btn" id="oks">Vou corrigir</button></div></div>`;
  $("#oks").onclick=()=>{a.innerHTML="";$("#nm").focus()};
}
function viewEntrada(){
  view(`<main class="card"><h1>O ÚLTIMO<br>EXPERIMENTO</h1><p class="sub">Uma mensagem estranha chegou na noite de Halloween. O laboratório da escola está aceso.</p>
  <label>Nome completo<input id="nm" autocomplete="off" autocapitalize="characters" placeholder="JOAO DA SILVA"></label>
  <p class="mut" style="margin:-.4rem 0 .6rem">Seu nome não precisa de acentos.</p>
  <label>Turma<input id="tm" autocomplete="off" placeholder="Ex.: 3A"></label>
  <button class="btn" id="go">Entrar no laboratório</button><button class="link" id="pf">Sou professor</button></main><div id="alerta"></div>`);
  $("#nm").oninput=e=>{const p=problema(e.target.value);if(p)susto(p)};
  $("#pf").onclick=viewLogin;$("#tm").onkeydown=e=>{if(e.key=="Enter")$("#go").click()};
  $("#go").onclick=async()=>{
    const n=$("#nm").value.trim().replace(/\s+/g," "),t=$("#tm").value.trim(),p=problema(n);
    if(p)return susto(p);if(n.length<3||!t)return toast("Preencha nome completo e turma.");
    const b=$("#go");b.disabled=true;
    try{const{data:{session}}=await sb.auth.getSession();
      if(!session){const{error}=await sb.auth.signInAnonymously();if(error)throw new Error(/anonymous/i.test(error.message)?"O professor precisa ativar o login anônimo no Supabase (Authentication > Sign In / Providers).":error.message)}
      const r=await rpc("entrar_como_aluno",{p_nome:n,p_turma:t});
      if(!r.ok){b.disabled=false;return toast({nome_invalido:"Nome inválido: use só letras, sem acentos.",conta_invalida:"Saia do painel do professor antes de entrar como aluno."}[r.motivo]||"Não encontramos esse nome nessa turma. Confira com seu professor.")}
      me=await rpc("meu_perfil");viewHome()}
    catch(e){b.disabled=false;toast(errMsg(e))}};
}
function viewLogin(modo="entrar"){
  const novo=modo=="criar";
  view(`<main class="card"><h1>Painel do professor</h1><p class="sub">Acesso restrito.</p>
  <div class="tabs"><button data-m="entrar" class="${novo?"":"on"}">Entrar</button><button data-m="criar" class="${novo?"on":""}">Criar conta</button></div>
  ${novo?'<label>Nome completo<input id="pn1" autocomplete="name"></label>':""}
  <label>E-mail<input id="u" type="email" autocomplete="username" autocapitalize="off"></label>
  <label>Senha${novo?" (mínimo 8 caracteres)":""}<input id="p" type="password" autocomplete="${novo?"new-password":"current-password"}"></label>
  ${novo?'<p class="mut">A primeira conta criada neste sistema vira professora automaticamente. As seguintes precisam ser liberadas por um professor já cadastrado.</p>':""}
  <button class="btn" id="go">${novo?"Criar conta":"Entrar"}</button><button class="link" id="vt">Voltar</button> <button class="link" id="cf">Configurar servidor</button></main>`);
  $$(".tabs button").forEach(b=>b.onclick=()=>viewLogin(b.dataset.m));$("#vt").onclick=viewEntrada;$("#cf").onclick=viewConfig;
  const liberar=async user=>{
    if(await rpc("is_professor"))return viewProf("geral");
    if(!(await rpc("existe_professor"))){const r=await rpc("registrar_primeiro_professor",{p_nome:(user.user_metadata&&user.user_metadata.nome)||(user.email||"Professor").split("@")[0]});if(r.ok)return viewProf("geral")}
    await sb.auth.signOut();toast("Conta criada, mas ainda não liberada como professor. Peça a um professor cadastrado para liberar seu e-mail.")};
  const go=async()=>{const u=$("#u").value.trim(),p=$("#p").value,b=$("#go");if(!u||!p)return toast("Preencha e-mail e senha.");
    b.disabled=true;
    try{let r;
      if(novo){const nome=$("#pn1").value.trim();if(nome.length<2)throw new Error("Informe seu nome completo.");if(p.length<8)throw new Error("A senha precisa de ao menos 8 caracteres.");
        r=await sb.auth.signUp({email:u,password:p,options:{data:{nome}}});if(r.error)throw r.error;
        if(!r.data.session){viewLogin("entrar");return toast("Conta criada. Se o Supabase pediu confirmação, confirme no seu e-mail e depois entre aqui.")}
        return await liberar(r.data.user)}
      r=await sb.auth.signInWithPassword({email:u,password:p});if(r.error)throw r.error;await liberar(r.data.user)}
    catch(e){toast(errMsg(e))}b.disabled=false};
  $("#go").onclick=go;$("#p").onkeydown=e=>{if(e.key=="Enter")go()};
}
async function route(){
  try{if(await rpc("is_professor"))return viewProf("geral");me=await rpc("meu_perfil");viewHome()}
  catch(e){if(e.message!="aluno_nao_encontrado"){toast(errMsg(e));await sb.auth.signOut()}viewEntrada()}
}
const logout=async()=>{await sb.auth.signOut();viewEntrada()};

/* ===== aluno: home ===== */
async function viewHome(){
  let list=[];try{list=await rpc("listar_minhas_avaliacoes")}catch(e){toast(errMsg(e))}
  const act=a=>({disponivel:`<button class="sm" data-play="${a.avaliacao_id}">Entrar no laboratório</button>`,
    em_andamento:`<button class="sm" data-play="${a.avaliacao_id}">Continuar de onde parou</button>`,
    concluida:`<button class="sm alt" data-res="${a.avaliacao_id}">Ver resultado</button>`,
    aguardando:`<span class="mut">Abre em ${fmtD(a.data_inicio)}</span>`,encerrada:`<span class="mut">Período encerrado</span>`,indisponivel:`<span class="mut">Indisponível</span>`}[a.estado]);
  view(`<div class="wrap"><div class="top"><div><h2>Olá, ${esc(me.nome)}</h2><span class="mut">${esc(me.turma||"")}</span></div><button class="sm alt" id="lo">Não sou eu</button></div>
  ${list.length?list.map(a=>`<div class="box"><h3>${esc(a.titulo)}</h3><p class="mut">${esc(a.descricao||"")}<br>Disponível de ${fmtD(a.data_inicio)} até ${fmtD(a.data_fim)}</p>${act(a)}</div>`).join(""):'<div class="box mut">Nenhuma avaliação liberada para você ainda. Peça ao professor para conferir se a prova está publicada e se o seu nome está na lista de autorizados.<br><button class="sm alt" id="rf" style="margin-top:8px">Atualizar</button></div>'}</div>`);
  $("#lo").onclick=logout;
  if($("#rf"))$("#rf").onclick=viewHome;
  $$("[data-play]").forEach(b=>b.onclick=()=>play(b.dataset.play,b));
  $$("[data-res]").forEach(b=>b.onclick=()=>showFinal(b.dataset.res));
}

/* ===== jogo ===== */
const NAMES=["Hall do laboratório","Corredor escuro","Biblioteca abandonada","Floresta ao redor da escola","Sala de experimentos","Arquivo esquecido","Estufa abandonada","Câmara das máquinas","Escadaria","A última porta"];
const KINDS=["porta","armario","maquina","personagem","porta","armario","maquina","personagem","porta","porta"];
const CAPS=["Somente aqueles que compreendem a natureza dos elementos poderão atravessar.","Uma luz pisca. Alguém escreveu na parede: não foi o primeiro a tentar.","Os livros sussurram quando você passa. Um deles está aberto.","As árvores parecem se inclinar na sua direção.","As máquinas ainda funcionam. Ninguém as liga há anos.","Um fichário range sozinho. Há um papel com seu nome.","Algo cresceu onde não deveria.","O zumbido fica mais grave a cada passo.","Os degraus contam mais do que deveriam.","A saída está logo ali. Algo observa do outro lado."];
const FIM={final_libertacao:["Você atravessa a porta e o ar frio da madrugada enche seus pulmões.","O laboratório se apaga atrás de você. Pela primeira vez em anos, ele descansa."],final_ambiguo:["A saída se abre, mas algo da escola vem junto, preso à sua sombra.","Você caminha para casa sem olhar para trás."],final_sombrio:["A porta cede, mas o corredor não termina.","As luzes se apagam uma a uma. O experimento continua."],final_derrota:["As luzes se apagam. A última coisa que você ouve é o zumbido das máquinas.","O laboratório guarda mais um nome."]};
let G=null,AC=null,muted=ls.get("ue_mute")=="1";

function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function buildRoom(i){
  const r=rng(i*977+13),dec=[],obs=[];const T=["abobora","vela","frasco","livros","caixa"];
  for(let n=0;n<7;n++){const x=150+r()*460,y=140+r()*270;if(dec.some(d=>Math.abs(d.x-x)<60&&Math.abs(d.y-y)<50))continue;
    const t=T[Math.floor(r()*5)];dec.push({x,y,t});obs.push({x:x-14,y:y-10,w:28,h:14})}
  const fx=700,fy=240;obs.push({x:fx-34,y:fy+30,w:68,h:30});
  return{i,dec,obs,fx,fy,hue:i%5,open:0,k:KINDS[i]}
}
async function play(avId,btn){
  if(btn)btn.disabled=true;
  try{const r=await rpc("iniciar_ou_recuperar_tentativa",{p_avaliacao_id:avId});
    if(!r.ok){toast(MSG[r.motivo]||"Não foi possível iniciar.");if(r.motivo=="ja_concluida")return showFinal(avId);return viewHome()}
    G={av:avId,tent:r.tentativa_id,vidas:r.vidas_restantes,vt:r.vidas_total,total:r.total,room:Math.min(r.respondidas,r.total-1),px:70,py:320,dir:"d",anim:0,walk:false,keys:{},jx:0,jy:0,phase:"play",pt:0,fade:0,shake:0,busy:false,paused:false,run:true,t:0,fog:Array.from({length:36},(_,i)=>({x:Math.random()*800,y:Math.random()*480,r:30+Math.random()*60,s:4+Math.random()*10,d:i%3==0}))};
    G.R=buildRoom(G.room);
    if(r.retomada)startStage();else intro()}
  catch(e){toast(errMsg(e));if(btn)btn.disabled=false}
}
function intro(){

/* loop / render */
function loop(now){
  if(!G||!G.run)return;requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-G.last)/1000);G.last=now;
  if(!G.paused){update(dt);G.t+=dt}
  draw();
}
function update(dt){
  const R=G.R;
  if(G.phase=="open"){G.pt+=dt;R.open=Math.min(1,G.pt/1.1);
    if(G.pt>1.8){if(G.done){G.phase="wait";endGame()}else{G.phase="out";G.pt=0}}}
  else if(G.phase=="out"){G.pt+=dt;G.fade=Math.min(1,G.pt/.7);if(G.pt>=.7){G.room++;enterRoom();G.phase="in";G.pt=0}}
  else if(G.phase=="in"){G.pt+=dt;G.fade=1-Math.min(1,G.pt/.7);if(G.pt>=.7){G.fade=0;G.phase="play"}}
  if(G.phase=="play"){
    let dx=(G.keys.d||G.keys.arrowright?1:0)-(G.keys.a||G.keys.arrowleft?1:0),dy=(G.keys.s||G.keys.arrowdown?1:0)-(G.keys.w||G.keys.arrowup?1:0);
    dx+=G.jx;dy+=G.jy;const l=Math.hypot(dx,dy);G.walk=l>.1;
    if(G.walk){if(l>1){dx/=l;dy/=l}const sp=130*dt;
      if(Math.abs(dx)>Math.abs(dy))G.dir=dx>0?"r":"l";else G.dir=dy>0?"d":"u";
      step(dx*sp,0);step(0,dy*sp);G.anim+=dt*9;if(Math.floor(G.anim)%2==0&&!G.sf){G.sf=1;blip(70,.04)}if(Math.floor(G.anim)%2==1)G.sf=0}
    $("#prompt").style.display=near()?"block":"none"}
  else $("#prompt").style.display="none";
  G.fog.forEach(f=>{f.x+=f.s*dt*(f.d?-1:1);if(f.x>900)f.x=-80;if(f.x<-100)f.x=880});
  G.shake=Math.max(0,G.shake-dt);
}
function step(dx,dy){
  const nx=G.px+dx,ny=G.py+dy;if(nx<18||nx>782||ny<130||ny>465)return;
  const b={x:nx-8,y:ny-6,w:16,h:8};
  if(G.R.obs.some(o=>b.x<o.x+o.w&&b.x+b.w>o.x&&b.y<o.y+o.h&&b.y+b.h>o.y))return;G.px=nx;G.py=ny;
}
const PAL=[["#2a1740","#170a24"],["#1c1029","#0f0716"],["#33182a","#1d0d19"],["#14221f","#0b1412"],["#2b1236","#1a0a22"]];

async function importar(txt){
  let j;try{j=JSON.parse(txt)}catch{throw new Error("JSON inválido.")}
  if(!Array.isArray(j.questoes)||j.questoes.length!=10)throw new Error("Informe exatamente 10 questões.");
  const{data:av,error}=await sb.from("avaliacoes").insert({titulo:j.titulo,descricao:j.descricao||null,quantidade_vidas:j.vidas||5,regra_encerramento:j.regra||"continuar",nota_maxima:j.nota_maxima||10,turma_id:j.turma_id||null}).select().single();
  if(error)throw error;
  const r=await sb.from("questoes").insert(j.questoes.map((q,i)=>({avaliacao_id:av.id,enunciado:q.enunciado,alternativas:q.alternativas,resposta_correta:q.correta,explicacao:q.explicacao||null,pontuacao:q.pontuacao||1,categoria:q.categoria||null,dificuldade:q.dificuldade||null,imagem_url:q.imagem_url||null,ordem:i+1})));
  if(r.error){await sb.from("avaliacoes").delete().eq("id",av.id);throw r.error}
}

    $("#qs").onclick=async()=>{
      const vals=$$("[data-alt]").map(i=>i.value.trim()),r=+($("input[name=qc]:checked")||{}).value,en=$("#qe").value.trim(),alt=vals.filter(Boolean);
      if(!en)return toast("Escreva o enunciado.");if(alt.length<2)return toast("Informe ao menos 2 alternativas.");if(!vals[r])return toast("Marque como correta uma alternativa preenchida.");
      const row={avaliacao_id:avId,ordem:cur,enunciado:en,alternativas:alt,resposta_correta:vals.slice(0,r).filter(Boolean).length,pontuacao:+$("#qp").value||1,categoria:$("#qg").value.trim()||null,dificuldade:$("#qd").value||null,imagem_url:$("#qi").value.trim()||null,explicacao:$("#qx").value.trim()||null};
      const res=by[cur]?await sb.from("questoes").update(row).eq("id",by[cur].id).select().single():await sb.from("questoes").insert(row).select().single();
      if(res.error)return toast(errMsg(res.error));by[cur]=res.data;toast("Questão "+cur+" salva.");if(cur<10)cur++;ui()};
  };
  ui();
}
boot();
</script>
</body>
</html>
