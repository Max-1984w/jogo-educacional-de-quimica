<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>A Mansão do Dr. Eletrônio</title>
<meta name="description" content="Prova bimestral de Química: eletronegatividade, 1º ano do ensino médio.">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#050308;--card:#0e0916;--tx:#f1ecf8;--mut:#9d8fb5;--ac:#b8ff1a;--ac2:#8a2be2;--bad:#ff5470;--ln:#4b2a7a}
*{box-sizing:border-box;border-radius:0!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.55 Arial,Helvetica,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font:900 2rem/1.05 Impact,'Arial Black',Arial,sans-serif;letter-spacing:.5px;color:var(--tx);margin:.3em 0 .2em}
h2{font:700 1.1rem Arial,sans-serif;color:var(--ac);margin:.2em 0 .6em}
.card{background:var(--card);border:2px solid var(--ln);box-shadow:6px 6px 0 var(--ac2);padding:20px;margin:18px 0}
.story{border:1px solid var(--ln);background:#000;padding:12px 14px;font:normal .95rem/1.6 'Courier New',Courier,monospace;color:#c9bbe8}
input,textarea,button,select{font:inherit;border:2px solid var(--ln);padding:10px 12px;background:#000;color:var(--tx);width:100%;margin:6px 0}
textarea{min-height:90px}
button{background:var(--ac);color:#050308;border:2px solid var(--ac);font-weight:800;padding:12px 16px;cursor:pointer}
button:hover:not(:disabled){background:#050308;color:var(--ac)}
button:disabled{opacity:.4;cursor:not-allowed}
button.sec{background:transparent;color:var(--tx);border:2px solid var(--ln);width:auto;margin-right:6px}
button.sec:hover{border-color:var(--ac);color:var(--ac)}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#000;border:2px solid var(--ln);color:var(--tx);font-weight:500}
.opt:hover:not(:disabled){background:#000;color:var(--tx);border-color:var(--ac2)}
.opt.on,.opt.on:hover{background:#12091f;border-color:var(--ac);color:var(--tx)}
.ltr{flex:none;width:28px;height:28px;display:grid;place-items:center;background:var(--ln);color:var(--tx);font-weight:800}
.opt.on .ltr{background:var(--ac);color:#050308}
.seg{display:flex;gap:4px;margin:10px 0 0}.seg i{flex:1;height:10px;background:var(--ln)}.seg i.d{background:var(--ac2)}.seg i.c{background:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:6px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--ac)}
.wrap{overflow-x:auto}.err{color:var(--bad)}.ok{color:var(--ac)}.code{font:700 1.1rem monospace;word-break:break-all;color:var(--ac2)}
.w{width:80px;margin:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.pad{display:flex;gap:8px;margin-top:12px}.pad button{width:auto;flex:1;margin:0;padding:18px 0;touch-action:none;user-select:none}
</style>
</head>

{s:"O Dr. Eletrônio surge das sombras, furioso: “Ordene os quatro e eu devolvo os elétrons da cidade… ou fique aqui para sempre!”",
 t:"Qual é a ordem decrescente de eletronegatividade entre C, N, O e F?",o:["C, N, O, F","O, F, N, C","F, O, N, C","N, F, C, O"],a:2}
];
const K="drE_",mem={};
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(K+k));localStorage.setItem(K+k,JSON.stringify(v))}catch(e){if(v===undefined)return mem[k]??null;mem[k]=v}}

const norm=n=>n.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ");
function hash(s){let h=5381;for(const c of s+"ELETRO26")h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36).toUpperCase().padStart(5,"0").slice(-5)}
const $=id=>document.getElementById(id),app=$("app");
let st=null;

function home(msg=""){
app.innerHTML=`<h1>A Mansão do Dr. Eletrônio</h1><p style="color:var(--mut)">Prova bimestral de Química: eletronegatividade, 1º ano</p>
<div class="card"><h2>Entrar na prova</h2><input id="nm" placeholder="Seu nome completo" autocomplete="off"><input id="cd" placeholder="Seu código (5 caracteres)" autocomplete="off" style="text-transform:uppercase">
<div class="err">${msg}</div><button onclick="login()">Começar</button></div>
<p><button class="sec" onclick="tLogin()">Área do professor</button></p>`}

const SB="https://jzalzkcbsmvqjrycjdrx.supabase.co",KEY="sb_publishable_bmOzl_lwm0tAWEMf3barnQ_C-jEVBVB";
async function rpc(fn,a){const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(a||{})});const t=await r.text();if(!r.ok)throw new Error(t||r.status);return t?JSON.parse(t):null}
async function login(){
const n=$("nm").value,c=$("cd").value.trim().toUpperCase();
if(!n.trim()||hash(norm(n))!==c)return home("Nome ou código inválido. Confira com seu professor.");
const done=ls("done_"+c);if(done){try{if(done.sent&&!await rpc("ja_enviou",{p_codigo:c})){ls("done_"+c,null);ls("st_"+c,null)}else return finish(done)}catch(e){return finish(done)}}
try{if(!await rpc("existe",{p_codigo:c}))return home("Este código não está cadastrado. Fale com o professor.");
if(await rpc("ja_enviou",{p_codigo:c}))return home("A prova deste aluno já foi enviada.")}catch(e){}
st=ls("st_"+c)||{n:n.trim(),c,i:0,a:Q.map(()=>null),p:perm(c),op:ops(c)};if(!st.p)st.p=Q.map((_,i)=>i);if(!st.op)st.op=ops(c);q()}
function rng(seed){let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;return()=>{h=(h+0x6D2B79F5)>>>0;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuf(n,r){const m=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[m[i],m[j]]=[m[j],m[i]]}return m}
function perm(c){return shuf(Q.length,rng(c+"PROVA"))}
function ops(c){const r=rng(c+"OPCOES");return Q.map(()=>shuf(4,r))}
/* JOGO DE PLATAFORMA */
const SEC=640,GW=800,GH=400;
let G=null,raf=0,last=0,acc=0;
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const nk=e=>e.key.length===1?e.key.toLowerCase():e.key;
function kd(e){if(!G)return;const k=nk(e);if(!G.paused&&["ArrowLeft","ArrowRight","ArrowUp"," "].includes(k))e.preventDefault();G.k[k]=1}
function ku(e){if(G)G.k[nk(e)]=0}
function stopGame(){cancelAnimationFrame(raf);G=null;removeEventListener("keydown",kd);removeEventListener("keyup",ku)}
function q(){if(st.i>=Q.length){if(!st.won)return startBoss();stopGame();const d={n:st.n,c:st.c,a:st.a,code:mk(st),op:st.op,sent:false};ls("done_"+st.c,d);return send(d)}startGame()}
function hud(){$("pn").textContent=Math.min(st.i+1,Q.length);$("sg").innerHTML=Q.map((_,k)=>`<i class="${k<st.i?"d":k===st.i?"c":""}"></i>`).join("")}
function ovShow(h){const o=$("ov");o.style.display="block";o.innerHTML=`<div class="card" style="max-width:720px;margin:0 auto">${h}</div>`}
function startGame(){
stopGame();
app.innerHTML=`<h1>Fase <span id="pn"></span> de ${Q.length}</h1><div class="seg" id="sg"></div>
<canvas id="cv" width="${GW}" height="${GH}" style="width:100%;display:block;margin-top:12px;border:2px solid var(--ln);box-shadow:6px 6px 0 var(--ac2);background:#000;image-rendering:pixelated"></canvas>
<div class="pad"><button class="sec" id="tl">Esquerda</button><button class="sec" id="tr">Direita</button><button class="sec" id="tc">Correr</button><button id="tj">Pular</button></div>
<p style="color:var(--mut);font-size:.9rem">Setas ou A e D para andar. Espaço ou seta para cima para pular (segure para pular mais alto). Shift ou X para correr. Pule em cima dos fantasmas, bata nos blocos "?" por baixo para soltar elétrons e chegue à porta para responder.</p>
<div id="ov" style="display:none;position:fixed;inset:0;z-index:50;overflow:auto;background:rgba(5,3,8,.96);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 32px"></div>`;
const so=[],en=[],co=[];
{const k=st.i,o=0,pit=k%2===1;
 if(pit)so.push({x:o,y:320,w:260,h:80},{x:o+350,y:320,w:SEC-350,h:80});else so.push({x:o,y:320,w:SEC,h:80});
 if(k%3===2){so.push({x:o+360,y:250,w:32,h:32,b:1},{x:o+392,y:250,w:32,h:32,q:1},{x:o+424,y:250,w:32,h:32,b:1});co.push({x:o+402,y:226})}
 if(k%3===1){so.push({x:o+140,y:240,w:32,h:32,b:1},{x:o+172,y:240,w:32,h:32,q:1},{x:o+204,y:240,w:32,h:32,b:1})}
 if(!pit&&k>0)so.push({x:o+330,y:280,w:40,h:40,t:1});
 if(pit)[275,305,335].forEach((d,j)=>co.push({x:o+d,y:j===1?215:230}));else[420,450,480].forEach(d=>co.push({x:o+d,y:292}));
 if(k>0&&k%2===0)en.push({x:o+120,a:o+120,b:o+300,y:288,d:1,alive:true})}
so.push({x:SEC,y:320,w:300,h:80});
G={x:40,y:288,w:22,h:32,vx:0,vy:0,g:false,f:1,k:{},n:0,hurt:0,paused:false,so,en,co,fx:[]};
hud();
const tb={tl:"ArrowLeft",tr:"ArrowRight",tj:" ",tc:"Shift"};
for(const id in tb){const b=$(id);b.onpointerdown=e=>{e.preventDefault();if(G)G.k[tb[id]]=1};["onpointerup","onpointerleave","onpointercancel"].forEach(h=>b[h]=()=>{if(G)G.k[tb[id]]=0})}
addEventListener("keydown",kd);addEventListener("keyup",ku);
if(st.i===0&&!st.intro){G.paused=true;ovShow(`<p class="story">${esc(INTRO)}</p><h2>Como jogar</h2><p>Use as setas (ou A e D) para andar, Espaço (ou seta para cima) para pular e Shift (ou X) para correr. Pule em cima dos fantasmas para derrotá-los, bata nos blocos "?" por baixo para soltar elétrons e cuidado com os buracos e os tubos de ensaio. Cada fase termina numa porta com uma pergunta.</p><p>Cair ou esbarrar em um fantasma só faz você voltar ao começo da fase. A nota depende apenas das suas respostas, e a mansão não avisa quais estão certas.</p><button onclick="begin()">Começar</button>`)}
last=0;acc=0;raf=requestAnimationFrame(loop)}
function begin(){st.intro=1;$("ov").style.display="none";G.paused=false}
function ask(){G.paused=true;G.k={};const x=Q[st.p[st.i]],ord=st.op[st.p[st.i]];st.sel=null;
ovShow(`<p style="color:var(--mut);margin:0 0 8px">Fase ${st.i+1} de ${Q.length}</p><p class="story">${esc(x.s)}</p><h2>${esc(x.t)}</h2>${ord.map((oi,j)=>`<button class="opt" onclick="pick(${j})"><b class="ltr">${"ABCD"[j]}</b><span>${esc(x.o[oi])}</span></button>`).join("")}<button id="go" disabled onclick="next()">Confirmar e abrir a porta</button>`)}
function die(){G.x=40;G.y=288;G.vx=G.vy=0;G.hurt=40}
function step(){
if(G.boss)return stepBoss();
const p=G,k=p.k,ax=(k.ArrowRight||k.d?1:0)-(k.ArrowLeft||k.a?1:0),run=k.Shift||k.x;
p.vx=ax*(run?5.4:3.6);if(ax)p.f=ax;
const jk=k[" "]||k.ArrowUp||k.w;
if(jk&&p.g){p.vy=-12.5;p.g=false}
if(!jk&&p.vy<-4)p.vy=-4;
p.vy=Math.min(p.vy+.6,14);
p.x=Math.max(0,p.x+p.vx);
if(p.vx)for(const s of p.so)if(hit(p,s))p.x=p.vx>0?s.x-p.w:s.x+s.w;
p.y+=p.vy;p.g=false;
for(const s of p.so)if(hit(p,s)){if(p.vy>0){p.y=s.y-p.h;p.g=true}else{p.y=s.y+s.h;if(s.q&&!s.u){s.u=1;p.n++;p.fx.push({x:s.x+10,y:s.y-6,t:24})}}p.vy=0}
if(p.y>GH+60)return die();
if(p.hurt>0)p.hurt--;
p.fx=p.fx.filter(f=>--f.t>0);p.fx.forEach(f=>f.y-=1.5);
for(const c of p.co)if(!c.t&&hit(p,{x:c.x,y:c.y,w:12,h:12})){c.t=1;p.n++}
for(const e of p.en){if(!e.alive)continue;e.x+=e.d;if(e.x<e.a||e.x>e.b)e.d*=-1;
 if(!p.hurt&&hit(p,{x:e.x,y:e.y,w:28,h:32})){if(p.vy>0&&p.y+p.h-p.vy<=e.y+12){e.alive=false;p.vy=-8}else return die()}}
const d=560;if(st.i<Q.length&&p.x+p.w>=d&&p.x<=d+40)ask()}
function loop(t){if(!G)return;acc+=Math.min(t-last,100);last=t;while(acc>=16.67){if(!G.paused)step();acc-=16.67}draw();raf=requestAnimationFrame(loop)}
function draw(){
if(G.boss)return drawBoss();
const c=$("cv").getContext("2d"),p=G,cam=Math.max(0,Math.min(p.x-320,SEC+300-GW));
c.fillStyle="#050308";c.fillRect(0,0,GW,GH);
c.fillStyle="#8a2be2";c.fillRect(650,36,56,56);c.fillStyle="#4b2a7a";c.fillRect(664,50,20,20);
for(let i=0;i<8;i++){const x=((i*190-cam*.35)%1520+1520)%1520-120,h=110+(i*53%90);c.fillStyle="#0e0916";c.fillRect(x,320-h,150,h);c.fillStyle=i%3?"#1a0f2e":"rgba(184,255,26,.55)";c.fillRect(x+30,320-h+28,14,18);c.fillRect(x+90,320-h+28,14,18)}
for(const s of p.so){const x=s.x-cam;if(x>GW||x+s.w<0)continue;
 if(s.q){c.fillStyle=s.u?"#2a1a44":"#b8ff1a";c.fillRect(x,s.y,s.w,s.h);c.strokeStyle="#050308";c.lineWidth=2;c.strokeRect(x+1,s.y+1,s.w-2,s.h-2);if(!s.u){c.fillStyle="#050308";c.font="bold 20px Arial";c.fillText("?",x+11,s.y+23)}}
 else if(s.b){c.fillStyle="#4b2a7a";c.fillRect(x,s.y,s.w,s.h);c.strokeStyle="#1a0f2e";c.lineWidth=2;c.strokeRect(x+1,s.y+1,s.w-2,s.h-2);c.beginPath();c.moveTo(x,s.y+16);c.lineTo(x+s.w,s.y+16);c.moveTo(x+16,s.y);c.lineTo(x+16,s.y+16);c.moveTo(x+8,s.y+16);c.lineTo(x+8,s.y+s.h);c.moveTo(x+24,s.y+16);c.lineTo(x+24,s.y+s.h);c.stroke()}
 else if(s.t){c.fillStyle="#1a0f2e";c.fillRect(x,s.y,s.w,s.h);c.fillStyle="rgba(184,255,26,.6)";c.fillRect(x+4,s.y+12,s.w-8,s.h-12);c.fillStyle="#f1ecf8";c.fillRect(x-3,s.y,s.w+6,8);c.fillStyle="rgba(241,236,248,.5)";c.fillRect(x+8,s.y+14,4,s.h-18)}
 else{c.fillStyle="#1a0f2e";c.fillRect(x,s.y,s.w,s.h);c.fillStyle="#8a2be2";c.fillRect(x,s.y,s.w,6)}}
for(const k of [st.i]){const x=560-cam;if(x<-60||x>GW)continue;const open=false;
 c.fillStyle="#4b2a7a";c.fillRect(x-4,252,48,68);c.fillStyle=open?"#000":"#8a2be2";c.fillRect(x,256,40,64);
 if(!open){c.fillStyle="#b8ff1a";c.fillRect(x+30,290,5,5);c.fillStyle="#f1ecf8";c.font="bold 16px Arial";c.fillText(k+1,x+(k>8?10:15),282)}}
for(const o of p.co){if(o.t)continue;const x=o.x-cam;c.fillStyle="#b8ff1a";c.fillRect(x,o.y,12,12);c.fillStyle="#050308";c.fillRect(x+4,o.y+4,4,4)}
for(const f of p.fx){c.fillStyle="#b8ff1a";c.font="bold 14px Arial";c.fillText("+1",f.x-cam,f.y)}
for(const e of p.en){if(!e.alive)continue;const x=e.x-cam;c.fillStyle="#f1ecf8";c.fillRect(x,e.y,28,24);[0,1,2].forEach(i=>{if(i!==1)c.fillRect(x+i*10,e.y+24,8,8)});c.fillStyle="#050308";c.fillRect(x+6,e.y+6,5,6);c.fillRect(x+17,e.y+6,5,6)}
if(!(p.hurt>0&&(p.hurt>>2)%2)){const x=p.x-cam,y=p.y;c.fillStyle="#4b2a7a";c.fillRect(x+3,y+26,6,6);c.fillRect(x+13,y+26,6,6);c.fillStyle="#f1ecf8";c.fillRect(x+1,y+13,20,13);c.fillStyle="#b8ff1a";c.fillRect(x+1,y+12,20,3);c.fillStyle="#e8d5c4";c.fillRect(x+4,y+2,14,11);c.fillStyle="#8a2be2";c.fillRect(x+3,y,16,5);c.fillStyle="#050308";c.fillRect(x+(p.f>0?13:6),y+7,3,3)}

const swd=()=>({x:G.f>0?G.x+G.w:G.x-52,y:G.y+4,w:52,h:22});

last=0;acc=0;raf=requestAnimationFrame(loop)}
function bossGo(){$("ov").style.display="none";G.paused=false}

function hurtB(){const p=G,b=p.b;p.hp--;p.inv=70;p.vy=-7;p.x=Math.max(0,Math.min(GW-p.w,p.x+(p.x<b.x?-40:40)));

function stepBoss(){
const p=G,k=p.k,b=p.b,ax=(k.ArrowRight||k.d?1:0)-(k.ArrowLeft||k.a?1:0),alive=b.hp>0;
p.vx=alive?ax*(k.Shift?5:3.6):0;if(ax&&alive)p.f=ax;
const jk=k[" "]||k.ArrowUp||k.w;
if(jk&&p.g&&alive){p.vy=-12.5;p.g=false}

const body={x:b.x,y:232,w:44,h:88};
if(!alive){p.wt++;if(p.wt===70){p.paused=true;p.k={};ovShow(`<h2>Dr. Eletrônio derrotado!</h2><p>A bobina de Tesla se apaga, os elétrons voltam para a cidade e a porta da mansão se abre. Falta só enviar a sua prova.</p><button onclick="bossWin()">Enviar prova</button>`)}return}
if(p.atk>0&&!p.hitDone&&b.inv<=0&&hit(swd(),body)){p.hitDone=true;b.hp--;b.inv=14;b.flash=10;b.x=Math.min(740,b.x+16)}
const ph2=b.hp<=6;
if(b.s==="walk"){b.x=Math.max(300,Math.min(740,b.x+Math.sign(p.x-b.x)*(ph2?1:.6)));
 if(--b.t<=0){b.k=Math.random()<.5?"low":"sky";const cx=p.x+11;b.xs=b.k==="sky"?[cx,Math.max(20,cx-140),Math.min(780,cx+140)]:[];b.s="charge";b.t=ph2?32:45}}
else if(b.s==="charge"){if(--b.t<=0){b.s="fire";b.t=26}}
else{const zs=b.k==="low"?[{x:0,y:288,w:b.x-30,h:32}]:b.xs.map(x=>({x:x-14,y:0,w:28,h:320}));
 if(!p.inv&&zs.some(z=>hit(p,z)))hurtB();
 if(--b.t<=0){b.s="walk";b.t=ph2?60:100}}
if(!p.paused&&!p.inv&&hit(p,body))hurtB()}
function bolt(c,x1,y1,x2,y2,w){c.strokeStyle="#b8ff1a";c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);const n=8;for(let i=1;i<n;i++){const t=i/n;c.lineTo(x1+(x2-x1)*t+(Math.random()-.5)*18,y1+(y2-y1)*t+(Math.random()-.5)*18)}c.lineTo(x2,y2);c.stroke();c.strokeStyle="#f1ecf8";c.lineWidth=w/2;c.stroke()}
function drawBoss(){
const c=$("cv").getContext("2d"),p=G,b=p.b;
c.fillStyle="#050308";c.fillRect(0,0,GW,GH);
c.fillStyle="#8a2be2";c.fillRect(650,36,56,56);c.fillStyle="#4b2a7a";c.fillRect(664,50,20,20);
for(let i=0;i<5;i++){const x=i*190-60,h=110+(i*53%90);c.fillStyle="#0e0916";c.fillRect(x,320-h,150,h);c.fillStyle=i%3?"#1a0f2e":"rgba(184,255,26,.55)";c.fillRect(x+30,320-h+28,14,18);c.fillRect(x+90,320-h+28,14,18)}
for(const s of p.so){c.fillStyle="#1a0f2e";c.fillRect(s.x,s.y,s.w,s.h);c.fillStyle="#8a2be2";c.fillRect(s.x,s.y,s.w,6)}
const ch=b.s!=="walk",bx=b.x;
c.setLineDash([10,8]);c.lineWidth=3;
if(b.s==="charge"){c.strokeStyle="rgba(255,84,112,.8)";if(b.k==="low"){c.strokeRect(0,290,bx-30,28)}else b.xs.forEach(x=>{c.beginPath();c.moveTo(x,0);c.lineTo(x,320);c.stroke()})}
c.setLineDash([]);
if(b.hp>0||(p.wt%6<3)){
 c.fillStyle="#4b2a7a";c.fillRect(bx+6,296,12,24);c.fillRect(bx+26,296,12,24);
 c.fillStyle=b.flash>0&&b.flash%4<2?"#ff5470":"#f1ecf8";c.fillRect(bx,244,44,54);
 c.fillStyle="#b8ff1a";c.fillRect(bx,244,44,4);c.fillRect(bx+20,248,4,50);
 c.fillStyle="#e8d5c4";c.fillRect(bx+8,222,28,24);
 c.fillStyle="#f1ecf8";c.fillRect(bx+4,214,36,10);[0,10,20,30].forEach(i=>c.fillRect(bx+4+i,206,6,10));
 c.fillStyle="#b8ff1a";c.fillRect(bx+10,230,10,8);c.fillRect(bx+24,230,10,8);
 c.fillStyle="#050308";c.fillRect(bx+12,232,4,4);c.fillRect(bx+26,232,4,4);
 c.fillStyle=b.flash>0&&b.flash%4<2?"#ff5470":"#f1ecf8";c.fillRect(bx-10,256,14,8);
 c.fillStyle="#4b2a7a";c.fillRect(bx-22,250,16,30);
 c.fillStyle="#8a2be2";c.fillRect(bx-17,226,6,26);
 c.fillStyle=ch?"#b8ff1a":"#8a2be2";c.beginPath();c.arc(bx-14,220,ch?12:9,0,7);c.fill();
 if(ch&&b.hp>0)bolt(c,bx-14,220,bx-14+(Math.random()-.5)*50,196-Math.random()*20,2)}
if(b.s==="fire"){if(b.k==="low"){bolt(c,bx-14,220,bx-30,304,5);bolt(c,bx-30,304,0,304,5)}else b.xs.forEach(x=>{c.fillStyle="rgba(184,255,26,.25)";c.fillRect(x-14,0,28,320);bolt(c,x,0,x,320,6)})}
if(!(p.inv>0&&(p.inv>>2)%2)){const x=p.x,y=p.y;c.fillStyle="#4b2a7a";c.fillRect(x+3,y+26,6,6);c.fillRect(x+13,y+26,6,6);c.fillStyle="#f1ecf8";c.fillRect(x+1,y+13,20,13);c.fillStyle="#b8ff1a";c.fillRect(x+1,y+12,20,3);c.fillStyle="#e8d5c4";c.fillRect(x+4,y+2,14,11);c.fillStyle="#8a2be2";c.fillRect(x+3,y,16,5);c.fillStyle="#050308";c.fillRect(x+(p.f>0?13:6),y+7,3,3)}
if(p.atk>0){const w=swd();c.fillStyle="rgba(184,255,26,.35)";c.fillRect(w.x,w.y,w.w,w.h);c.fillStyle="#b8ff1a";c.fillRect(w.x,w.y+8,w.w,6);c.fillStyle="#f1ecf8";c.fillRect(w.x,w.y+10,w.w,2);bolt(c,w.x,w.y+11,w.x+w.w,w.y+11,2)}
else{c.fillStyle="#b8ff1a";c.fillRect(p.f>0?p.x+20:p.x-8,p.y+14,10,4);c.fillStyle="#f1ecf8";c.fillRect(p.f>0?p.x+20:p.x-8,p.y+15,10,2)}
c.fillStyle="#b8ff1a";c.font="bold 14px Arial";c.fillText("Vida: "+"♥".repeat(Math.max(0,p.hp)),12,24);

function pick(j){st.sel=st.op[st.p[st.i]][j];document.querySelectorAll(".opt").forEach((b,k)=>b.classList.toggle("on",k===j));$("go").disabled=false}
function next(){st.a[st.p[st.i]]=st.sel;st.i++;ls("st_"+st.c,{n:st.n,c:st.c,i:st.i,a:st.a,p:st.p,op:st.op,intro:1});$("ov").style.display="none";q()}
function mk(s){const p=s.n+"|"+s.a.join("");return btoa(unescape(encodeURIComponent(p+"|"+hash(p))))}
async function send(d){app.innerHTML='<div class="card"><p>Enviando sua prova…</p></div>';
try{d.sent=!!await rpc("enviar",{p_codigo:d.c,p_respostas:d.a.join("")});d.err=d.sent?"":"O servidor recusou o envio (prova já enviada ou código não cadastrado)."}catch(e){d.err="Sem conexão com o servidor."}
ls("done_"+d.c,d);finish(d)}
function retry(c){send(ls("done_"+c))}
function finish(d){
const hit=d.a.map((v,i)=>v===Q[i].a),n=hit.filter(Boolean).length;
app.innerHTML=`<h1>Você escapou da mansão</h1><div class="card"><p>${esc(d.n)}, prova finalizada. Você acertou <b class="ok">${n}</b> de ${Q.length} portas. A nota oficial será divulgada pelo professor.</p>
${d.sent?'<p class="ok"><b>Prova enviada ao professor.</b></p>':`<p class="err"><b>Prova ainda não enviada.</b> ${esc(d.err||"")}</p><button onclick="retry('${d.c}')">Tentar enviar de novo</button><p>Se não conseguir, mostre este código ao professor:</p><div class="code">${d.code}</div>`}</div>

/* PROFESSOR */
let PIN="",DATA=[],W=[];
const fmt=n=>String(n).replace(".",",");
function dist(t){const u=t*2,b=Math.floor(u/Q.length),r=u%Q.length;return Q.map((_,i)=>(b+(i<r?1:0))/2)}
function tLogin(msg=""){app.innerHTML=`<h1>Área do professor</h1><div class="card"><input id="pin" type="password" placeholder="PIN do professor"><div class="err">${msg}</div><button onclick="tCheck()">Entrar</button><button class="sec" onclick="home()">Voltar</button></div>`}
async function load(){const w=await rpc("prof_pesos",{p_pin:PIN});if(w.length!==Q.length)throw new Error("tabela de pesos vazia: rode o script SQL");W=w.map(x=>Number(x.peso));DATA=await rpc("prof_resultados",{p_pin:PIN})||[]}
async function tCheck(){const p=$("pin").value;try{if(!await rpc("pin_ok",{p}))return tLogin("PIN incorreto.");PIN=p;await load();panel()}catch(e){tLogin("Não foi possível conectar ao banco: "+esc(e.message))}}
async function refresh(){try{await load();panel()}catch(e){panel("Erro: "+e.message)}}
function panel(msg=""){
const T=W.reduce((a,b)=>a+b,0),loc=ls("res")||{},sc=a=>a.reduce((s,v,i)=>s+(v===Q[i].a?W[i]:0),0),ok=a=>a.filter((v,i)=>v===Q[i].a).length;
const names=new Set(DATA.map(r=>norm(r.nome)));
const rows=DATA.map(r=>{const a=r.respostas?r.respostas.split("").map(Number):null;return `<tr><td>${esc(r.nome)}</td><td class="code" style="font-size:.9rem">${esc(r.codigo)}</td><td>${a?"Enviou":"Pendente"}</td><td>${a?ok(a)+"/"+Q.length:"-"}</td><td><b>${a?fmt(sc(a)):"-"}</b></td><td>${a?`<button class="sec" style="margin:0 6px 0 0;padding:6px 10px" onclick="liberar('${esc(r.codigo)}')">Liberar</button>`:""}<button class="sec" style="margin:0 6px 0 0;padding:6px 10px" onclick="excluir('${esc(r.codigo)}')">Excluir</button></td></tr>`}).join("")
+Object.entries(loc).filter(([k])=>!names.has(k)).map(([k,r])=>`<tr><td>${esc(r.n)}</td><td>-</td><td>Importado</td><td>${ok(r.a)}/${Q.length}</td><td><b>${fmt(sc(r.a))}</b></td><td>-</td></tr>`).join("");
app.innerHTML=`<h1>Painel do professor</h1><button class="sec" onclick="home()">Sair</button><button class="sec" onclick="refresh()">Atualizar dados</button><div class="err">${esc(msg)}</div>
<div class="card"><h2>PIN do professor</h2><input id="np" placeholder="Novo PIN (mínimo 4 caracteres)"><button onclick="setPin()">Alterar PIN</button></div>
<div class="card"><h2>1. Contas dos alunos</h2><p style="color:var(--mut)">Um nome por linha. O código de cada aluno é gerado e salvo no banco.</p>
<textarea id="lst">${esc(DATA.map(r=>r.nome).join("\n"))}</textarea><button onclick="saveAl()">Gerar códigos e salvar</button></div>
<div class="card"><h2>2. Valor da prova e de cada questão</h2><p>Valor total da prova: <select id="tot" style="width:auto" onchange="setTot(this.value)">${Array.from({length:11},(_,i)=>5+i/2).map(v=>`<option value="${v}"${v===T?" selected":""}>${fmt(v)}</option>`).join("")}</select> <span style="color:var(--mut)">(de 5 a 10, passos de 0,5; ao mudar, os pesos são redistribuídos)</span></p>
<p>Soma das questões: <b class="${T>=5&&T<=10?"ok":"err"}">${fmt(T)}</b> ${T>=5&&T<=10?"":"(fora de 5 a 10: ajuste)"}</p>
<div class="wrap"><table><tr>${W.map((v,i)=>`<td>Q${i+1}<input class="w" type="number" min="0" max="10" step="0.5" value="${v}" onchange="setW(${i},this.value)"></td>`).join("")}</tr></table></div></div>
<div class="card"><h2>3. Alunos e resultados</h2><div class="wrap"><table><tr><th>Aluno</th><th>Código</th><th>Situação</th><th>Acertos</th><th>Nota</th><th>Ações</th></tr>${rows}</table></div>
<p style="color:var(--mut)">Reserva: se um aluno não conseguiu enviar, cole o código de entrega dele aqui, um por linha.</p><textarea id="imp"></textarea><button onclick="imp()">Importar</button></div>`}
async function liberar(c){if(!confirm("Apagar a prova enviada deste aluno e permitir que ele refaça?"))return;try{await rpc("prof_liberar",{p_pin:PIN,p_codigo:c});await load();panel("Prova liberada. O aluno já pode entrar de novo.")}catch(e){panel("Erro: "+e.message)}}

async function saveAl(){const l=$("lst").value.split("\n").map(s=>s.trim()).filter(Boolean);try{await Promise.all(l.map(n=>rpc("prof_salvar_aluno",{p_pin:PIN,p_codigo:hash(norm(n)),p_nome:n})));await load();panel("Alunos salvos.")}catch(e){panel("Erro: "+e.message)}}
async function setW(i,v){v=Math.round(parseFloat(v||0)*2)/2;try{await rpc("prof_salvar_peso",{p_pin:PIN,p_questao:i+1,p_peso:v});W[i]=v;panel()}catch(e){panel("Erro: "+e.message)}}
async function setTot(v){const d=dist(parseFloat(v));try{await Promise.all(d.map((p,i)=>rpc("prof_salvar_peso",{p_pin:PIN,p_questao:i+1,p_peso:p})));W=d;panel()}catch(e){panel("Erro: "+e.message)}}
async function setPin(){const p=$("np").value.trim();if(p.length<4)return alert("Use pelo menos 4 caracteres.");try{await rpc("prof_trocar_pin",{p_pin:PIN,p_novo:p});PIN=p;alert("PIN alterado.")}catch(e){alert("Não foi possível trocar o PIN. Rode o SQL extra no Supabase.")}}
function imp(){const res=ls("res")||{};let bad=0;
$("imp").value.split("\n").map(s=>s.trim()).filter(Boolean).forEach(l=>{try{const p=decodeURIComponent(escape(atob(l))).split("|"),ck=p.pop(),b=p.join("|");if(hash(b)!==ck)throw 0;const k=b.lastIndexOf("|"),a=b.slice(k+1).split("").map(Number);res[norm(b.slice(0,k))]={n:b.slice(0,k),a}}catch(e){bad++}});
